<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <title>References Add</title>
  <link rel="stylesheet" href="destination.css">
</head>
<body>
<main>
  <h1>References Add</h1>
  <p class="description">Choose a References project for this capture.</p>
  <form>
    <label id="backendField">Backend<select id="backend"></select></label>
    <label>Project<select id="project" required></select></label>
    <p id="status" role="status" aria-live="polite"></p>
    <footer>
      <button id="cancel" type="button">Cancel</button>
      <button id="manager" type="button" disabled hidden>Open manager</button>
      <button id="add" type="submit" disabled>Add</button>
    </footer>
  </form>
  <details>
    <summary>Source and licenses</summary>
    <p><a href="about.html">About References</a> · <a href="../legal/NOTICE.md">Source attribution</a> · <a href="../COPYING">License</a></p>
    <p>References uses Zotero Connector source under the AGPL.</p>
  </details>
</main>
<script src="destination.js"></script>
</body>
</html>
