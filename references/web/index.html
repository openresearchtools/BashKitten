<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <title>References · Taskarian</title>
    <link rel="stylesheet" href="./references.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="app-header">
        <h1>References</h1>
        <button id="jobHistory" type="button">Jobs</button>
        <button id="settings" type="button">Settings</button>
        <button id="about" type="button" aria-label="About References">About</button>
      </header>
      <div class="library-layout">
        <aside class="libraries" id="projectsPanel" aria-labelledby="projectsHeading">
          <div class="sidecar-header"><h2 id="projectsHeading">Projects</h2><button id="closeProjects" type="button" aria-label="Close Projects">×</button></div>
          <button id="newProject" type="button">New project</button>
          <div class="toolbar"><label class="field"
              ><input id="showArchived" type="checkbox" />Show archived</label
            >
          </div>
          <div
            id="projects"
            class="project-list"
            aria-label="Projects"
          ></div>
          <div class="toolbar">
            <button id="savedSearches" type="button">Saved searches</button>
            <button id="deletedItems" type="button">Deleted items</button>
          </div>
        </aside>
        <main class="library-main" id="referenceMain">
          <div class="toolbar reference-toolbar" aria-label="Project references">
            <button id="toggleProjects" type="button" aria-label="Projects sidecar" aria-controls="projectsPanel" aria-expanded="false">Projects</button>
            <button id="newItem" type="button">New item</button
            ><button id="identifiers" type="button">Add by Identifier</button
            ><button id="importReferences" type="button">Import…</button
            ><button id="openalex" type="button">Literature search</button>
            <button id="refresh" type="button">Reload references</button>
            <button id="referenceMenuButton" class="icon-only action-menu-toggle" type="button" aria-label="More reference actions" title="More reference actions" popovertarget="referenceMenu"><span id="menuIcon">☰</span></button>
            <button id="toggleDetails" type="button" aria-label="Item details sidecar" aria-controls="detailsPanel" aria-expanded="false">Details</button>
          </div>
          <div class="action-menu-items" id="referenceMenu" popover>
            <button id="exportReferences" type="button">Export…</button>
            <button id="cite" type="button">Cite…</button>
            <button id="columns" type="button">Columns…</button>
          </div>
          <div class="search-row">
            <label class="reference-search"><span id="searchIcon" aria-hidden="true"></span><input
              id="search"
              type="search"
              placeholder="All fields & tags"
              aria-label="Search all fields and tags"
            /></label>
          </div>
          <div class="selection-row" role="group" aria-label="Reference selection">
            <select id="actions" aria-label="Selected item actions">
              <option value="">Selected items…</option>
              <option value="enrich">Enrich metadata</option>
              <option value="resolve-pdfs">Find available PDFs</option>
              <option value="delete">Move to deleted items</option>
              <option value="restore">Restore deleted items</option>
              <option value="export">Export selected items…</option>
            </select>
            <button id="selectAll" type="button" aria-label="Select all" title="Select all matching references"><span class="selection-label-wide">Select all</span><span class="selection-label-short" aria-hidden="true">All</span></button>
            <button id="selectNone" type="button" aria-label="Select none" title="Clear the reference selection"><span class="selection-label-wide">Select none</span><span class="selection-label-short" aria-hidden="true">None</span></button>
          </div>
          <div class="reference-grid" id="referenceGrid">
            <div class="table-header" id="itemHeader" role="row"></div>
            <div id="items" class="item-list"></div>
          </div>
        </main>
        <aside id="detailsPanel" class="item-details" aria-labelledby="detailsHeading">
          <div class="sidecar-header"><h2 id="detailsHeading">Item details</h2><button id="closeDetails" type="button" aria-label="Close item details">×</button></div>
          <div id="details" class="item-details-content"><p class="empty-details">Select an item to view and edit its details.</p></div>
        </aside>
        <button id="sidecarBackdrop" class="sidecar-backdrop" type="button" aria-label="Close sidecar" tabindex="-1" hidden></button>
      </div>
      <footer class="app-status">
        <span id="status" role="status" aria-live="polite"
          >Connecting to References…</span
        >
        <div id="jobs" class="job-list"></div>
      </footer>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
