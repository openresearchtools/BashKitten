<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <title>References · BashKitten</title>
    <link rel="stylesheet" href="./references.css" />
  </head>
  <body>
    <div class="app" id="app" data-pane="items">
      <header class="app-header">
        <h1>References</h1>
        <nav class="mobile-tabs" aria-label="References panes">
          <button type="button" data-pane="libraries">Projects</button
          ><button type="button" data-pane="items">Items</button
          ><button type="button" data-pane="details">Details</button>
        </nav>
        <button id="jobHistory" type="button">Jobs</button>
        <button id="settings" type="button">Settings</button>
        <button id="about" type="button" aria-label="About References">About</button>
      </header>
      <div class="library-layout">
        <aside class="libraries" aria-label="Reference projects">
          <h2>Projects</h2>
          <button id="newProject" type="button">New project</button>
          <div class="toolbar"><label class="field"
              ><input id="showArchived" type="checkbox" />Show archived</label
            >
          </div>
          <div
            id="projects"
            class="project-list"
            aria-label="Projects"
          ></div>
          <div class="toolbar">
            <button id="savedSearches" type="button">Saved searches</button>
            <button id="deletedItems" type="button">Deleted items</button>
          </div>
        </aside>
        <main class="library-main">
          <div class="toolbar reference-toolbar" aria-label="Project references">
            <button id="newItem" type="button">New item</button
            ><button id="identifiers" type="button">Add by Identifier</button
            ><button id="importReferences" type="button">Import…</button
            ><button id="openalex" type="button">Literature search</button>
            <span class="toolbar-spacer"></span>
            <details class="action-menu" id="referenceMenu">
              <summary aria-label="More reference actions" title="More reference actions"><span id="menuIcon">☰</span></summary>
              <div class="action-menu-items">
                <button id="exportReferences" type="button">Export…</button>
                <button id="cite" type="button">Cite…</button>
                <button id="columns" type="button">Columns…</button>
              </div>
            </details>
          </div>
          <div class="search-row">
            <label class="reference-search"><span id="searchIcon" aria-hidden="true"></span><input
              id="search"
              type="search"
              placeholder="All fields & tags"
              aria-label="Search all fields and tags"
            /></label><button id="refresh" type="button">Refresh</button>
            <button id="multiSelect" type="button" aria-pressed="false">Select</button>
            <select id="actions" aria-label="Selected item actions">
              <option value="">Selected items…</option>
              <option value="enrich">Enrich metadata</option>
              <option value="resolve-pdfs">Find available PDFs</option>
              <option value="delete">Move to deleted items</option>
              <option value="restore">Restore deleted items</option>
              <option value="export">Export selected items…</option>
            </select>
          </div>
          <div class="reference-grid" id="referenceGrid">
            <div class="table-header" id="itemHeader" role="row"></div>
            <div id="items" class="item-list"></div>
          </div>
        </main>
        <aside id="details" class="item-details" aria-label="Item details">
          <p class="empty-details">
            Select an item to view and edit its details.
          </p>
        </aside>
      </div>
      <footer class="app-status">
        <span id="status" role="status" aria-live="polite"
          >Connecting to References…</span
        >
        <div id="jobs" class="job-list"></div>
      </footer>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
