// SPDX-License-Identifier: AGPL-3.0-only
plugins {
    alias(libs.plugins.kotlin.android)
}

apply plugin: 'com.android.library'

def source = layout.buildDirectory.dir('termux-x11').get().asFile
def abi = gradle.mozconfig.substs.ANDROID_CPU_ARCH
android {
    namespace 'com.termux.x11'
    compileSdk { version = release(project.ext.compileSdkMajorVersion) { minorApiLevel = project.ext.compileSdkMinorVersion } }
    ndkVersion '29.0.14206865'
    defaultConfig {
        minSdk 31
        ndk { abiFilters abi }
        externalNativeBuild.cmake { arguments '-DANDROID_STL=c++_static', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON', "-DBASHKITTEN_DISPLAY_SOURCE=$source" }
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures { aidl true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.java.srcDirs += "$source/lorie/src/main/java"
    sourceSets.main.res.srcDirs += "$source/embedded-res"
    externalNativeBuild.cmake { path 'CMakeLists.txt'; version '3.22.1' }
    packagingOptions.jniLibs.useLegacyPackaging false
}
dependencies {
    api project(':bashkitten-sdk')
    implementation libs.androidx.appcompat
    implementation libs.google.material
}
tasks.register('prepareDisplay', Exec) {
    commandLine 'python3', "$projectDir/prepare.py", source
    inputs.file 'prepare.py'
    inputs.dir 'patches'
    inputs.dir '../../../../bashkitten/vendor/termux-x11'
    inputs.dir '../../../../bashkitten/vendor/display-dependencies'
    outputs.dir source
}
tasks.named('preBuild').configure { dependsOn 'prepareDisplay' }
tasks.configureEach { task ->
    if (task.name.startsWith('configureCMake') || task.name.startsWith('buildCMake')) task.dependsOn 'prepareDisplay'
}
