plugins {
    alias(libs.plugins.kotlin.android)
}

apply plugin: 'com.android.library'

def taskarianAbi = gradle.mozconfig.substs.ANDROID_CPU_ARCH
if (!(taskarianAbi in ['arm64-v8a', 'x86_64'])) {
    throw new GradleException("Unsupported Taskarian Android ABI: $taskarianAbi")
}

android {
    namespace 'com.taskarian'
    compileSdk {
        version = release(project.ext.compileSdkMajorVersion) { minorApiLevel = project.ext.compileSdkMinorVersion }
    }
    defaultConfig {
        minSdk 31
        targetSdk project.ext.targetSdkVersion
        ndk { abiFilters taskarianAbi }
        manifestPlaceholders = project.ext.manifestPlaceholders
        consumerProguardFiles 'consumer-rules.pro'
    }
    buildFeatures { aidl true; buildConfig true }
    sourceSets.main.assets.srcDirs += "$buildDir/generated/notices"
    sourceSets.main.assets.srcDirs += "$buildDir/generated/references"
    androidResources {
        noCompress 'ja'
        // Match the app's asset policy: AAPT's default filter drops the
        // References connector's required _locales directories in this AAR.
        ignoreAssetsPattern = "manifest.template.json"
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.jniLibs.srcDirs += "$buildDir/generated/tor"
    sourceSets.main.assets.srcDirs += "$buildDir/generated/tor-provenance"
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}

repositories {
    maven { url 'https://raw.githubusercontent.com/guardianproject/gpmaven/master' }
}

def remoteClientAar = file("${System.getenv('TASKARIAN_REMOTE_CLIENT_DIR')}/taskarian-remote.aar")

dependencies {
    api project(':taskarian-sdk')
    api project(':taskarian-display')
    implementation project(':taskarian-telephony')
    implementation files(remoteClientAar)
    implementation project(':geckoview')
    implementation project(':components:support-utils')
    implementation libs.androidx.appcompat
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata
    implementation libs.google.material
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'info.guardianproject:jtorctl:0.4.5.7'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}

tasks.register('checkRemoteClient') {
    doLast {
        if (!remoteClientAar.isFile()) {
            throw new GradleException('Build the native remote client with auth/build/remote-android.sh first')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'checkRemoteClient' }

tasks.register('stageNotices', Exec) {
    commandLine 'python3', "${rootProject.projectDir}/taskarian/android/scripts/notices.py", "$buildDir/generated/notices"
    inputs.files(fileTree("${rootProject.projectDir}/taskarian/android/notices"))
    inputs.file("${rootProject.projectDir}/taskarian/android/scripts/notices.py")
    // The bundle records this checkout's commit and source notices.
    outputs.upToDateWhen { false }
    outputs.dir "$buildDir/generated/notices"
}
tasks.named('preBuild').configure { dependsOn 'stageNotices' }

tasks.register('stageTor', Exec) {
    commandLine 'python3', "${rootProject.projectDir}/taskarian/android/scripts/tor.py", "$buildDir/generated/tor", taskarianAbi, "$buildDir/generated/tor-provenance"
    inputs.property('abi', taskarianAbi)
    inputs.file("${rootProject.projectDir}/taskarian/android/scripts/tor.py")
    inputs.files(fileTree("${rootProject.projectDir}/taskarian/android/tor"))
    inputs.file("${rootProject.projectDir}/taskarian/third_party/tor.toml")
    inputs.property('runtime', System.getenv('TASKARIAN_TOR_ANDROID_DIR') ?: '')
    outputs.file("$buildDir/generated/tor/$taskarianAbi/libtor.so")
    outputs.dir("$buildDir/generated/tor-provenance")
    // Always validate the supplied native artifact against the current pins.
    outputs.upToDateWhen { false }
}
tasks.named('preBuild').configure { dependsOn 'stageTor' }

// The privileged host is fixed APK code; capture logic is an ordinary signed add-on.
tasks.register('stageReferencesHost', Exec) {
    commandLine 'python3', "${rootProject.projectDir}/taskarian/references/stage_host.py", "$buildDir/generated/references"
    inputs.files(fileTree("${rootProject.projectDir}/../references/connector/host"))
    inputs.files(fileTree("${rootProject.projectDir}/../references/connector/dist/references"))
    inputs.file("${rootProject.projectDir}/../references/connector/dist/runtime-sha256.json")
    inputs.file("${rootProject.projectDir}/taskarian/references/stage_host.py")
    outputs.dir "$buildDir/generated/references"
}
tasks.named('preBuild').configure { dependsOn 'stageReferencesHost' }
