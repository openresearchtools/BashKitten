[package]
name = "bashkitten-sudo-bridge"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/openresearchtools/BashKitten"

[dependencies]
libc = "=0.2.191"

[[bin]]
name = "bashkitten-sudo"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
