name: V3 checks
on:
  push:
    branches: [V3]
  pull_request:
    branches: [V3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        node: ['22.19.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm test
      - run: npm run check
      - run: npm run example
      - name: Install host peers locally for loader test (no lifecycle scripts)
        run: npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-coding-agent@1.3.0 typebox@1.3.27
      - run: npm run smoke:pi
      - run: npm pack --dry-run
