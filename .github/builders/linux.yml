name: BashKitten Linux package
run-name: BashKitten ${{ inputs.source_sha }} / ${{ inputs.request_id }}
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact BashKitten source commit
        required: true
        type: string
      request_id:
        description: Request from the main workflow
        required: true
        type: string
      warm_gkrust:
        default: false
        type: boolean
      auth_run:
        required: true
        type: string
      search_run:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: browser-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ${{ github.repository == 'openresearchtools/bashkitten-build-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTUP_TOOLCHAIN: 1.96.0
      BASHKITTEN_BUILD_JOBS: '2'
      BASHKITTEN_BUILD_RUN_ID: hosted
      SCCACHE_IDLE_TIMEOUT: '0'
      GH_TOKEN: ${{ github.token }}
      PI_TELEMETRY: '0'
      PI_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openresearchtools/bashkitten
        ref: ${{ inputs.source_sha }}
        path: source/bashkitten
        persist-credentials: false
    - name: Select the native target
      run: |
        # Python's IPDL workers create Unix sockets below the build temp path.
        echo "MOZBUILD_STATE_PATH=$RUNNER_TEMP/bk/browser/state" >> "$GITHUB_ENV"
        case "$GITHUB_REPOSITORY" in
          openresearchtools/bashkitten-build-arm64) echo 'BROWSER_TARGET=linux-arm64' >> "$GITHUB_ENV"; echo 'BROWSER_ARCH=arm64' >> "$GITHUB_ENV" ;;
          openresearchtools/bashkitten-build-amd64) echo 'BROWSER_TARGET=linux-amd64' >> "$GITHUB_ENV"; echo 'BROWSER_ARCH=amd64' >> "$GITHUB_ENV" ;;
          *) exit 1 ;;
        esac
    - id: component
      name: Restore a matching completed browser artifact
      run: python3 source/bashkitten/agent/packaging/browser-component.py restore "$BROWSER_TARGET" --directory "$RUNNER_TEMP/browser/stage"
    - name: Prepare runner
      if: steps.component.outputs.hit != 'true'
      run: source/bashkitten/agent/packaging/linux/prepare-runner.sh
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      if: steps.component.outputs.hit != 'true'
      with:
        version: v0.17.0
    - name: Install the compatible Rust toolchain
      if: steps.component.outputs.hit != 'true'
      run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
    - name: Bootstrap pinned Mozilla toolchain
      if: steps.component.outputs.hit != 'true'
      working-directory: source/bashkitten/browser
      run: ./mach --no-interactive bootstrap --application-choice browser
    - name: Optional native Rust cache warm-up
      if: steps.component.outputs.hit != 'true' && inputs.warm_gkrust
      run: source/bashkitten/browser/bashkitten/scripts/build-linux-external.sh --action gkrust --build-root "$RUNNER_TEMP/bk/warm" --jobs 2 --ref HEAD
    - name: Build the complete browser archive
      if: steps.component.outputs.hit != 'true'
      run: |
        source/bashkitten/browser/bashkitten/ci/build-browser-artifact.sh \
          --bashkitten "$GITHUB_WORKSPACE/source/bashkitten/browser" \
          --commit "$SOURCE_SHA" --architecture "$BROWSER_ARCH" \
          --input-digest "$INPUT_DIGEST" \
          --work-dir "$RUNNER_TEMP/bk" \
          --artifact-dir "$RUNNER_TEMP/browser/stage"
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
        INPUT_DIGEST: ${{ steps.component.outputs.digest }}
    - name: Verify the browser archive and source inputs
      run: python3 source/bashkitten/agent/packaging/browser-component.py verify "$BROWSER_TARGET" --directory "$RUNNER_TEMP/browser/stage"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.component.outputs.artifact }}
        path: ${{ runner.temp }}/browser/stage/
        compression-level: 0
        if-no-files-found: error
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install assembly tools
      run: sudo apt-get update && sudo apt-get install -y zstd python3
    - name: Download native components for this source
      env:
        AUTH_RUN: ${{ inputs.auth_run }}
        SEARCH_RUN: ${{ inputs.search_run }}
      run: |
        for item in "auth:$AUTH_RUN:auth-$BROWSER_TARGET" "search:$SEARCH_RUN:search-runtime-$BROWSER_TARGET"; do
          IFS=: read -r target run artifact <<< "$item"
          while ! gh api "repos/openresearchtools/bashkitten/actions/runs/$run/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fxq "$artifact"; do
            status=$(gh api "repos/openresearchtools/bashkitten/actions/runs/$run" --jq '.status')
            if [ "$status" = completed ]; then echo "Required $artifact is missing from completed run $run" >&2; exit 1; fi
            sleep 30
          done
          gh run download "$run" --repo openresearchtools/bashkitten --name "$artifact" --dir "$RUNNER_TEMP/companion/$target"
        done
    - name: Assemble complete native package
      run: |
        python3 agent/packaging/build.py linux \
          --architecture "$BROWSER_ARCH" --output "$RUNNER_TEMP/package" \
          --auth-archive "$RUNNER_TEMP/companion/auth/auth-$BROWSER_TARGET.tar.gz" \
          --search-archive "$RUNNER_TEMP/companion/search/search-runtime-$BROWSER_TARGET.tar.zst" \
          --browser-dir "$RUNNER_TEMP/browser/stage"
      working-directory: source/bashkitten
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bashkitten-${{ env.BROWSER_TARGET }}-candidate
        path: ${{ runner.temp }}/package/
        if-no-files-found: error
        compression-level: 0
    - name: Record actual compiler cache statistics
      if: always() && steps.component.outputs.hit != 'true' && env.SCCACHE_PATH != ''
      run: |
        "$SCCACHE_PATH" --show-stats --stats-format=json > "$RUNNER_TEMP/sccache-statistics.json"
        "$SCCACHE_PATH" --show-stats >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.component.outputs.hit != 'true'
      with:
        name: compiler-cache-statistics
        path: ${{ runner.temp }}/sccache-statistics.json
        if-no-files-found: ignore
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: failure()
      with:
        name: browser-build-logs
        path: ${{ runner.temp }}/bk/browser/runs/hosted/logs/
        if-no-files-found: ignore
