name: Taskarian Linux package
run-name: Taskarian ${{ inputs.source_sha }} / ${{ inputs.request_id }}
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Taskarian source commit
        required: true
        type: string
      request_id:
        description: Request from the main workflow
        required: true
        type: string
      force_rebuild:
        description: Bypass native browser artifact reuse
        default: false
        type: boolean
      warm_gkrust:
        default: false
        type: boolean
      auth_run:
        required: false
        type: string
      search_run:
        required: false
        type: string
      node_run:
        required: false
        type: string
      environments_run:
        required: false
        type: string
      office_run:
        required: false
        type: string
      engine_only:
        description: Build or validate the independent Gecko component without waiting for app dependencies
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
jobs:
  browser:
    runs-on: ${{ github.repository == 'openresearchtools/taskarian-build-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      SCCACHE_GHA_ENABLED: 'true'
      RUSTUP_TOOLCHAIN: 1.96.0
      TASKARIAN_BUILD_JOBS: '2'
      TASKARIAN_BUILD_RUN_ID: hosted
      SCCACHE_IDLE_TIMEOUT: '0'
      GH_TOKEN: ${{ github.token }}
      PI_TELEMETRY: '0'
      PI_OFFLINE: '1'
      DO_NOT_TRACK: '1'
      SCCACHE_MULTILEVEL_CHAIN: disk,gha
      SCCACHE_DIR: ${{ github.workspace }}-gecko-sccache
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openresearchtools/Taskarian
        ref: ${{ inputs.source_sha }}
        path: source/taskarian
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /.github/builders/
          /agent/packaging/*.py
          /agent/packaging/node/lock.json
          /agent/vendor/native/android-sources.json
          /agent/src/server/platform/termux/updates-prepare.py
          /browser/taskarian/android/mozconfig
          /browser/taskarian/android/tor/
          /browser/taskarian/android/notices/
          /browser/taskarian/android/scripts/tor.py
          /browser/taskarian/third_party/tor.toml
          /browser/mobile/shared/modules/geckoview/TaskarianAndroid.sys.mjs
          /browser/mobile/android/installer/package-manifest.in
          /references/runtime-payload.json
          /browser/taskarian/config/
    - name: Select the native target
      run: |
        # Python's IPDL workers create Unix sockets below the build temp path.
        echo "MOZBUILD_STATE_PATH=$RUNNER_TEMP/bk/browser/state" >> "$GITHUB_ENV"
        case "$GITHUB_REPOSITORY" in
          openresearchtools/taskarian-build-arm64) echo 'BROWSER_TARGET=linux-arm64' >> "$GITHUB_ENV"; echo 'BROWSER_ARCH=arm64' >> "$GITHUB_ENV" ;;
          openresearchtools/taskarian-build-amd64) echo 'BROWSER_TARGET=linux-amd64' >> "$GITHUB_ENV"; echo 'BROWSER_ARCH=amd64' >> "$GITHUB_ENV" ;;
          *) exit 1 ;;
        esac
    - id: component
      name: Restore a matching completed browser artifact
      env:
        TASKARIAN_FORCE_FULL_BUILD: ${{ inputs.force_rebuild && '1' || '0' }}
        ENGINE_ONLY: ${{ inputs.engine_only }}
      run: |
        arguments=()
        if [ "$ENGINE_ONLY" = true ]; then arguments+=(--force-build); fi
        python3 source/taskarian/agent/packaging/browser-component.py restore "$BROWSER_TARGET" --directory "$RUNNER_TEMP/browser/stage" "${arguments[@]}"
    - id: native-component
      name: Restore a matching custom Gecko engine for current resources
      if: steps.component.outputs.hit != 'true'
      env:
        TASKARIAN_FORCE_FULL_BUILD: ${{ inputs.force_rebuild && '1' || '0' }}
      run: python3 source/taskarian/agent/packaging/browser-component.py restore-native "$BROWSER_TARGET" --directory "$RUNNER_TEMP/browser/native"
    - name: Materialize required build or assembly sources
      working-directory: source/taskarian
      env:
        NATIVE_REUSED: ${{ steps.component.outputs.hit }}
        GIT_LFS_SKIP_SMUDGE: '1'
      run: |
        python3 - <<'PYTHON'
        import json, os, subprocess
        from pathlib import Path
        payload = json.loads(Path('references/runtime-payload.json').read_text())
        patterns = ['/LICENSE', '/AGENTS.md', '/.github/', '/agent/', '!/agent/machines/vendor/',
                    '/auth/build/', '/auth/upstreams.lock.json', '/auth/dependencies/*/sources.json',
                    '/auth/dependencies/termux-lock.json', '/node/',
                    '/os/skills/', '/os/licenses/', '/os/NOTICE', '/os/packaging/', '/os/upstream/sources.json',
                    '/office/', '!/office/upstream/', '/office/upstream/*.json',
                    '/office/upstream/dependencies/*.json', '/office/upstream/dependencies/*.py',
                    '/files/', '!/files/upstream/', '/files/upstream/*.json',
                    '/references/connector/', '/references/vendor/translators/', '/references/legal/',
                    '/references/vendor/npm/', '/references/web/theme.css']
        if os.environ.get('NATIVE_REUSED') == 'true':
            patterns += ['/browser/taskarian/config/', '/browser/taskarian/scripts/',
                         '/browser/taskarian/browser/branding/']
        else:
            patterns += ['/browser/']
        patterns += ['/references/' + pattern for pattern in payload['files']]
        for item in payload['legal']:
            patterns += ['/references/' + item['source']]
            patterns += ['/references/' + path for path in item['files']]
        subprocess.run(['git', 'sparse-checkout', 'set', '--no-cone', '--stdin'],
                       input='\n'.join(patterns) + '\n', text=True, check=True)
        PYTHON
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Prepare runner
      if: steps.component.outputs.hit != 'true'
      run: source/taskarian/agent/packaging/linux/prepare-runner.sh
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      if: steps.component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true'
      with:
        version: v0.17.0
    - name: Install the compatible Rust toolchain
      if: steps.component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true'
      run: |
        version=$(python3 -c 'import json; print(json.load(open("source/taskarian/agent/machines/rust-toolchain/sources.json"))["version"])')
        test "$RUSTUP_TOOLCHAIN" = "$version"
        rustup toolchain install "$version" --profile minimal --component rust-docs --target wasm32-unknown-unknown
        printf '%s\n' "TASKARIAN_PHOTON_BUILD_CACHE=$RUNNER_TEMP/photon-cache" "TASKARIAN_SOURCE_CACHE=$RUNNER_TEMP/source-cache" >> "$GITHUB_ENV"
    - name: Select the source archive cache for component assembly
      run: echo "TASKARIAN_SOURCE_CACHE=$RUNNER_TEMP/source-cache" >> "$GITHUB_ENV"
    - name: Select the Gecko compiler cache contract
      id: gecko-cache-contract
      if: steps.component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true'
      working-directory: source/taskarian
      run: |
        digest=$(python3 agent/packaging/browser-release.py cache-contract "$BROWSER_TARGET" --output "$RUNNER_TEMP/gecko-cache-contract.json")
        printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
    - name: Restore the Gecko disk compiler cache
      id: gecko-disk-cache
      if: steps.component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: gecko-disk-v1-${{ env.BROWSER_TARGET }}-${{ steps.gecko-cache-contract.outputs.digest }}-${{ github.run_id }}
        restore-keys: |
          gecko-disk-v1-${{ env.BROWSER_TARGET }}-${{ steps.gecko-cache-contract.outputs.digest }}-
          gecko-disk-v1-${{ env.BROWSER_TARGET }}-${{ steps.gecko-cache-contract.outputs.legacy_digest }}-
    - name: Check whether the restored compiler cache contains objects
      id: gecko-disk-availability
      if: steps.component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true'
      working-directory: source/taskarian
      run: python3 agent/packaging/compiler-cache.py available --directory "$SCCACHE_DIR"
    - name: Restore compiler release backup only without an Actions copy
      if: steps.component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true' && steps.gecko-disk-availability.outputs.available != 'true'
      working-directory: source/taskarian
      run: python3 agent/packaging/browser-release.py restore-cache "$BROWSER_TARGET" --directory "$SCCACHE_DIR"
    - name: Bootstrap pinned Mozilla toolchain
      if: steps.component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true'
      working-directory: source/taskarian/browser
      run: ./mach --no-interactive bootstrap --application-choice browser
    - name: Bootstrap Mozilla resource assembly tools
      if: steps.component.outputs.hit != 'true' && steps.native-component.outputs.hit == 'true'
      working-directory: source/taskarian/browser
      run: ./mach --no-interactive bootstrap --application-choice browser_artifact_mode
    - name: Optional native Rust cache warm-up
      if: steps.component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true' && inputs.warm_gkrust
      run: source/taskarian/browser/taskarian/scripts/build-linux-external.sh --action gkrust --build-root "$RUNNER_TEMP/bk/warm" --jobs 2 --ref HEAD
    - name: Build the complete browser archive
      if: steps.component.outputs.hit != 'true'
      run: |
        source/taskarian/browser/taskarian/ci/build-browser-artifact.sh \
          --taskarian "$GITHUB_WORKSPACE/source/taskarian/browser" \
          --commit "$SOURCE_SHA" --architecture "$BROWSER_ARCH" \
          --input-digest "$INPUT_DIGEST" \
          --work-dir "$RUNNER_TEMP/bk" \
          --artifact-dir "$RUNNER_TEMP/browser/stage"
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
        INPUT_DIGEST: ${{ steps.component.outputs.digest }}
    - name: Verify the browser archive and source inputs
      run: python3 source/taskarian/agent/packaging/browser-component.py verify "$BROWSER_TARGET" --directory "$RUNNER_TEMP/browser/stage"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.component.outputs.artifact }}
        path: ${{ runner.temp }}/browser/stage/
        compression-level: 0
        if-no-files-found: error
      id: engine-checkpoint
    - name: Release verified native object intermediates before cache backup
      if: always() && !cancelled() && steps.engine-checkpoint.outcome == 'success' && steps.component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true'
      working-directory: ${{ runner.temp }}/bk/browser/runs/hosted/source/browser
      run: ./mach clobber
    - name: Record native cache hits and flush the completed disk objects
      id: gecko-cache-state
      if: always() && !cancelled() && steps.component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true' && steps.gecko-cache-contract.outputs.digest != '' && env.SCCACHE_PATH != ''
      working-directory: source/taskarian
      run: |
        "$SCCACHE_PATH" --show-stats --stats-format=json > "$RUNNER_TEMP/sccache-gecko.json"
        "$SCCACHE_PATH" --show-stats >> "$GITHUB_STEP_SUMMARY"
        if ! "$SCCACHE_PATH" --stop-server 2> "$RUNNER_TEMP/sccache-stop.log"; then
          cat "$RUNNER_TEMP/sccache-stop.log" >&2
          if ! grep -q "couldn't connect to server" "$RUNNER_TEMP/sccache-stop.log"; then exit 1; fi
        fi
        python3 agent/packaging/compiler-cache.py available --directory "$SCCACHE_DIR"
    - name: Save the Gecko disk compiler cache
      if: always() && !cancelled() && steps.gecko-cache-state.outputs.available == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ env.SCCACHE_DIR }}
        key: gecko-disk-v1-${{ env.BROWSER_TARGET }}-${{ steps.gecko-cache-contract.outputs.digest }}-${{ github.run_id }}
      continue-on-error: true
    - name: Keep the completed compiler objects as a release fallback
      if: always() && !cancelled() && steps.gecko-cache-state.outputs.available == 'true'
      working-directory: source/taskarian
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 agent/packaging/compiler-cache.py save sccache "$BROWSER_TARGET" --contract "$RUNNER_TEMP/gecko-cache-contract.json" --directory "$SCCACHE_DIR"
    - name: Upload actual Gecko compiler cache statistics
      if: always() && !cancelled() && steps.component.outputs.hit != 'true' && steps.native-component.outputs.hit != 'true' && steps.gecko-cache-contract.outputs.digest != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: gecko-compiler-cache-statistics
        path: ${{ runner.temp }}/sccache-gecko.json
        if-no-files-found: ignore
    - name: Publish the verified native Gecko component
      if: always() && !cancelled() && steps.engine-checkpoint.outcome == 'success'
      working-directory: source/taskarian
      run: python3 agent/packaging/browser-release.py publish-engine "$BROWSER_TARGET" --directory "$RUNNER_TEMP/browser/stage"
      id: publish-engine
    - name: Publish the current browser resources independently
      working-directory: source/taskarian
      run: python3 agent/packaging/browser-release.py publish-resources "$BROWSER_TARGET" --directory "$RUNNER_TEMP/browser/stage"
      if: always() && !cancelled() && steps.publish-engine.outcome == 'success'
    - name: Install assembly tools
      run: sudo apt-get update && sudo apt-get install -y zstd python3
    - name: Assemble from the exact durable component modules
      working-directory: source/taskarian
      run: python3 agent/packaging/prepare-assembly.py build "$BROWSER_TARGET" --directory "$RUNNER_TEMP/assembly-inputs" --output "$RUNNER_TEMP/package" --browser-dir "$RUNNER_TEMP/browser/stage"
      if: '!inputs.engine_only'
    - name: Publish the complete application independently
      working-directory: source/taskarian
      run: |
        python3 agent/packaging/browser-release.py dependencies "$BROWSER_TARGET" --directory "$RUNNER_TEMP/assembly-inputs" --output "$RUNNER_TEMP/browser-dependencies.json"
        python3 agent/packaging/application.py publish "$BROWSER_TARGET" --directory "$RUNNER_TEMP/package" --dependencies "$RUNNER_TEMP/browser-dependencies.json"
      if: '!inputs.engine_only'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: taskarian-${{ env.BROWSER_TARGET }}-candidate
        path: ${{ runner.temp }}/package/
        if-no-files-found: error
        compression-level: 0
      if: '!inputs.engine_only'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: failure()
      with:
        name: browser-build-logs
        path: ${{ runner.temp }}/bk/browser/runs/hosted/logs/
        if-no-files-found: ignore
