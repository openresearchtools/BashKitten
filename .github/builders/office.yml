name: Pinned native Files and Office components
run-name: Office ${{ inputs.source_sha }} / ${{ inputs.request_id }}
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact Taskarian source commit
        required: true
        type: string
      request_id:
        description: Collection request from the normal package build
        required: true
        type: string
      force_rebuild:
        description: Ignore completed native artifacts and compile from source
        required: false
        default: false
        type: boolean
      target:
        description: Native targets to build
        required: false
        default: all
        type: choice
        options:
          - all
          - linux-arm64
      component:
        description: Native components to build
        required: false
        default: all
        type: choice
        options:
          - all
          - office
          - files
permissions:
  contents: read
  actions: read
concurrency:
  group: office-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(inputs.component == 'office' && '["office"]' || inputs.component == 'files' && '["files"]' || '["office","files"]') }}
        platform: >-
          ${{ fromJSON(inputs.target == 'linux-arm64' &&
          '[{"target":"linux","architecture":"arm64","runner":"ubuntu-24.04-arm"}]' ||
          '[{"target":"linux","architecture":"amd64","runner":"ubuntu-24.04"},{"target":"linux","architecture":"arm64","runner":"ubuntu-24.04-arm"},{"target":"termux","architecture":"aarch64","runner":"ubuntu-24.04"},{"target":"termux","architecture":"x86_64","runner":"ubuntu-24.04"}]') }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.office-ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      TASKARIAN_SOURCE_CACHE: ${{ github.workspace }}/.source-cache
      GOTELEMETRY: 'off'
      DO_NOT_TRACK: '1'
    steps:
      - name: Require an immutable source commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: openresearchtools/Taskarian
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          filter: blob:none
          sparse-checkout: |
            /.gitignore
            /.github/builders/office.yml
            /agent/packaging/remote-office.py
            /agent/packaging/native-component.py
            /agent/packaging/applications.py
            /agent/packaging/build.py
      - name: Restore a matching completed native component
        id: component-reuse
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.platform.target }}-${{ matrix.platform.architecture }}
          COMPONENT: ${{ matrix.component }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        run: python3 source/agent/packaging/remote-office.py restore --component "$COMPONENT" --target "$TARGET" --directory "$RUNNER_TEMP/office-output" --force "$FORCE_REBUILD"
      - name: Materialize changed native component sources
        if: steps.component-reuse.outputs.hit != 'true'
        env:
          COMPONENT: ${{ matrix.component }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git -C source sparse-checkout add --stdin <<PATTERNS
          /.gitignore
          /$COMPONENT/
          /LICENSE
          /browser/taskarian/browser/branding/
          /auth/dependencies/go-toolchain/
          /auth/build/go-notices.py
          /files/patches/collabora/
          /agent/packaging/office/
          /agent/packaging/source_cache.py
          /agent/packaging/node/
          /agent/packaging/termux/native_toolchain.py
          /agent/licenses/upstream/saxes/
          /agent/vendor/node/libcxx/
          /agent/vendor/node/sources.json
          PATTERNS
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.component-reuse.outputs.hit != 'true'
        with:
          node-version: '24.13.0'
      - id: go-compiler
        name: Select the existing retained Go toolchain
        if: steps.component-reuse.outputs.hit != 'true' && matrix.component == 'files'
        run: python3 -c 'import json; print("version=" + json.load(open("source/auth/dependencies/go-toolchain/sources.json"))["version"])' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: steps.component-reuse.outputs.hit != 'true' && matrix.component == 'files'
        with:
          go-version: ${{ steps.go-compiler.outputs.version }}
          cache: false
      - name: Prepare native build prerequisites
        if: steps.component-reuse.outputs.hit != 'true'
        run: bash source/agent/packaging/office/prepare-runner.sh
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: native-cache
        if: steps.component-reuse.outputs.hit != 'true'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: native-ccache-${{ matrix.component }}-${{ matrix.platform.target }}-${{ matrix.platform.architecture }}-${{ hashFiles('source/office/upstream/online/source.json', 'source/office/upstream/dependencies/sources.json', 'source/agent/packaging/office/**', 'source/agent/packaging/source_cache.py', 'source/agent/packaging/termux/native_toolchain.py', 'source/agent/packaging/node/lock.json', 'source/office/patches/**', 'source/office/branding/**', 'source/browser/taskarian/browser/branding/**', 'source/LICENSE', 'source/auth/build/go-notices.py', 'source/auth/dependencies/go-toolchain/**', 'source/files/patches/**', 'source/files/build.py', 'source/files/termux.py', 'source/files/vendor/dependencies/*sources.json') }}-${{ github.run_id }}
          restore-keys: |
            native-ccache-${{ matrix.component }}-${{ matrix.platform.target }}-${{ matrix.platform.architecture }}-
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.component-reuse.outputs.hit != 'true' && matrix.platform.target == 'termux'
        with:
          path: ${{ runner.temp }}/office-ndk-archive
          key: office-ndk-${{ hashFiles('source/agent/packaging/node/lock.json') }}
      - name: Prepare the existing pinned native Termux toolchain
        if: steps.component-reuse.outputs.hit != 'true' && matrix.platform.target == 'termux'
        run: |
          python3 - <<'PYTHON'
          import importlib.util, os, pathlib, subprocess
          root = pathlib.Path('source').resolve()
          spec = importlib.util.spec_from_file_location('node_build', root / 'agent/packaging/node/build.py')
          native = importlib.util.module_from_spec(spec); spec.loader.exec_module(native)
          cache = pathlib.Path(os.environ['RUNNER_TEMP']) / 'office-ndk-archive'; cache.mkdir(exist_ok=True)
          archive = native.fetch(native.LOCK['termux']['dependency_sources']['libc++'], cache)
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'office-ndk'; destination.mkdir(exist_ok=True)
          subprocess.run(['unzip', '-q', str(archive), '-d', str(destination)], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('OFFICE_NDK=' + str(destination / 'android-ndk-r30') + '\n')
              env.write('OFFICE_NDK_ARCHIVE=' + str(archive) + '\n')
          PYTHON
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: source-cache
        if: steps.component-reuse.outputs.hit != 'true'
        with:
          path: ${{ env.TASKARIAN_SOURCE_CACHE }}
          key: source-archives-${{ matrix.component }}-${{ hashFiles('source/**/sources.json', 'source/**/native-sources.json', 'source/**/licensed-go-sources.json', 'source/agent/packaging/source_cache.py') }}
      - name: Build native engine and server from retained sources
        if: steps.component-reuse.outputs.hit != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/office-output"
          native_args=()
          if [[ "$TASKARIAN_BUILD_TARGET" = termux ]]; then
            native_args=(--ndk "$OFFICE_NDK" --ndk-archive "$OFFICE_NDK_ARCHIVE")
          fi
          if [[ "$TASKARIAN_BUILD_COMPONENT" = office ]]; then
            recipe=build.py
            if [[ "$TASKARIAN_BUILD_TARGET" = termux ]]; then
              recipe=termux.py
              native_args+=(--architecture "$TASKARIAN_BUILD_ARCHITECTURE")
            fi
            command=(python3 -B "source/agent/packaging/office/$recipe" "${native_args[@]}"
              --work "$RUNNER_TEMP/office-work" --cache "$RUNNER_TEMP/office-tarballs"
              --output "$RUNNER_TEMP/office-output" --jobs 2)
          else
            export CC='ccache gcc' CXX='ccache g++'
            command=(python3 -B source/files/build.py "${native_args[@]}"
              --work-dir "$RUNNER_TEMP/office-work" --target "$TASKARIAN_BUILD_TARGET" --architecture "$TASKARIAN_BUILD_ARCHITECTURE"
              --output "$RUNNER_TEMP/office-output/files-$TASKARIAN_BUILD_TARGET-$TASKARIAN_BUILD_ARCHITECTURE.tar.gz" --jobs 2)
          fi
          "${command[@]}" 2>&1 | tee "$RUNNER_TEMP/office-build.log"
        env:
          TASKARIAN_BUILD_COMPONENT: ${{ matrix.component }}
          TASKARIAN_BUILD_TARGET: ${{ matrix.platform.target }}
          TASKARIAN_BUILD_ARCHITECTURE: ${{ matrix.platform.architecture }}
      - name: Preserve native compiler cache after the build
        if: always() && steps.native-cache.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Preserve verified source downloads
        if: always() && steps.source-cache.outcome == 'success' && steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.TASKARIAN_SOURCE_CACHE }}
          key: ${{ steps.source-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.component }}-${{ matrix.platform.target }}-${{ matrix.platform.architecture }}-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/office-output/
          if-no-files-found: error
          compression-level: 0
      - name: Collect build diagnostics
        if: always() && steps.component-reuse.outputs.hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/office-diagnostics"
          cp "$RUNNER_TEMP/office-build.log" "$RUNNER_TEMP/office-diagnostics/" 2>/dev/null || true
          df -h > "$RUNNER_TEMP/office-diagnostics/disk.txt"
          ccache -s > "$RUNNER_TEMP/office-diagnostics/ccache.txt"
          du -sx source "$RUNNER_TEMP/office-work" "$CCACHE_DIR" > "$RUNNER_TEMP/office-diagnostics/workspace-kib.txt" 2>/dev/null || true
          dpkg-query -W -f='${Package}\t${Version}\n' > "$RUNNER_TEMP/office-diagnostics/builder-packages.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.component-reuse.outputs.hit != 'true'
        with:
          name: ${{ matrix.component }}-build-diagnostics-${{ matrix.platform.target }}-${{ matrix.platform.architecture }}
          path: ${{ runner.temp }}/office-diagnostics/
