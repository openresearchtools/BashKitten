name: Collect complete corresponding source
run-name: Sources ${{ inputs.source_sha }} / ${{ inputs.request_id }}
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string
permissions:
  contents: write
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openresearchtools/Taskarian
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /agent/packaging/
          /browser/taskarian/config/version.txt
    - name: Publish exact repository source changes and permanent baseline links
      run: python3 agent/packaging/source-delivery.py
