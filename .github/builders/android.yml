name: BashKitten Android browser
run-name: BashKitten ${{ inputs.source_sha }} / ${{ inputs.request_id }}
'on':
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact BashKitten source commit
        required: true
        type: string
      request_id:
        description: Request from the main workflow
        required: true
        type: string
      auth_run:
        required: true
        type: string
      search_run:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: browser-${{ inputs.source_sha }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MOZCONFIG: ${{ github.workspace }}/browser/bashkitten/android/mozconfig
      MOZBUILD_STATE_PATH: ${{ github.workspace }}-mozbuild
      BASHKITTEN_ANDROID_OBJDIR: ${{ github.workspace }}-obj-android
      ANDROID_NDK_HOME: ${{ github.workspace }}-mozbuild/android-ndk-r29
      PYTHONUNBUFFERED: '1'
      DISABLE_TELEMETRY: '1'
      RUSTUP_TOOLCHAIN: 1.96.0
      MACH_SHOW_PIP_OUTPUT: '1'
      SCCACHE_GHA_ENABLED: 'true'
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx3g
      MOZ_SOURCE_REPO: https://github.com/openresearchtools/bashkitten
      MOZ_SOURCE_CHANGESET: ${{ inputs.source_sha }}
      SCCACHE_IDLE_TIMEOUT: '0'
      SCCACHE_BASEDIRS: ${{ github.workspace }}:${{ github.workspace }}-obj-android
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: openresearchtools/bashkitten
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - id: component
      name: Restore a matching completed Android artifact
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 agent/packaging/browser-component.py restore android --directory candidate
    - name: Prepare hosted runner
      run: |
        printf '%s\n' "BASHKITTEN_PUBLISHER_KEYSTORE=$RUNNER_TEMP/droid.p12" "BASHKITTEN_COMPANION_LICENSES=$RUNNER_TEMP/companion-licenses.json" >> "$GITHUB_ENV"
        mkdir -p artifacts "$MOZBUILD_STATE_PATH"
        cat > "$MOZBUILD_STATE_PATH/machrc" <<'MACHRC'
        [mach_telemetry]
        is_enabled = false
        is_set_up = true
        is_employee = false
        MACHRC
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        sudo apt-get update
        sudo apt-get install -y build-essential python3-dev python3-venv libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdbus-glib-1-dev libdrm-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev m4 nasm unzip zip zstd imagemagick
        sudo fallocate -l 8G /mnt/bashkitten.swap
        sudo chmod 600 /mnt/bashkitten.swap
        sudo mkswap /mnt/bashkitten.swap
        sudo swapon /mnt/bashkitten.swap
      if: (success()) && steps.component.outputs.hit != 'true'
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: toolchain-cache
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        key: bashkitten-android-gradle-downloads-v1-${{ runner.os }}-${{ hashFiles('browser/gradle/libs.versions.toml', 'browser/mobile/android/android-components/.config.yml', 'browser/mobile/android/*/build.gradle',
          'browser/mobile/android/fenix/app/build.gradle', 'browser/python/mozboot/mozboot/android.py', 'browser/python/mozboot/mozboot/mozconfig.py') }}
        restore-keys: bashkitten-android-gradle-downloads-v1-${{ runner.os }}-
      if: (success()) && steps.component.outputs.hit != 'true'
    - name: Stage the existing Droid signing identity
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: python3 browser/bashkitten/android/scripts/prepare-signing.py
      if: (success()) && steps.component.outputs.hit != 'true'
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      with:
        version: v0.17.0
      if: (success()) && steps.component.outputs.hit != 'true'
    - name: Install the compatible Rust toolchain
      run: rustup toolchain install 1.96.0 --profile minimal --target aarch64-linux-android
      if: (success()) && steps.component.outputs.hit != 'true'
    - name: Bootstrap the pinned Mozilla Android toolchain
      working-directory: browser
      timeout-minutes: 30
      run: set -o pipefail; ./mach --no-interactive bootstrap --application-choice mobile_android 2>&1 | tee ../artifacts/bootstrap.log
      if: (success()) && steps.component.outputs.hit != 'true'
    - name: Generate the product artwork
      working-directory: browser
      run: python3 bashkitten/scripts/render-branding.py
      if: (success()) && steps.component.outputs.hit != 'true'
    - name: Build Gecko for ARM64
      working-directory: browser
      run: set -o pipefail; ./mach build 2>&1 | tee ../artifacts/gecko-build.log
      if: (success()) && steps.component.outputs.hit != 'true'
    - name: Record Gecko compiler cache statistics
      if: always() && steps.component.outputs.hit != 'true' && env.SCCACHE_PATH != ''
      run: |
        "$SCCACHE_PATH" --show-stats --stats-format=json > artifacts/sccache-gecko.json
        "$SCCACHE_PATH" --show-stats >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
      if: (success()) && steps.component.outputs.hit != 'true'
    - name: Obtain the actual companion component licenses
      env:
        GH_TOKEN: ${{ github.token }}
        AUTH_RUN: ${{ inputs.auth_run || github.run_id }}
        SEARCH_RUN: ${{ inputs.search_run || github.run_id }}
      run: |
        for item in "auth:$AUTH_RUN:auth-termux-aarch64" "search:$SEARCH_RUN:search-runtime-termux-aarch64"; do
          IFS=: read -r target run artifact <<< "$item"
          ready=false
          for attempt in $(seq 1 60); do
            count=$(gh api --paginate "repos/openresearchtools/bashkitten/actions/runs/$run/artifacts" --jq ".artifacts[] | select(.name == \"$artifact\" and .expired == false) | .id" | wc -l)
            if [ "$count" = 1 ]; then ready=true; break; fi
            echo "Waiting for $artifact from run $run ($attempt/60)"
            sleep 30
          done
          test "$ready" = true
          gh run download "$run" --repo "openresearchtools/bashkitten" --name "$artifact" --dir "$RUNNER_TEMP/companion/$target"
        done
        python3 agent/packaging/android-notices.py \
          --auth-archive "$RUNNER_TEMP/companion/auth/auth-termux-aarch64.tar.gz" \
          --search-archive "$RUNNER_TEMP/companion/search/search-runtime-termux-aarch64.tar.zst" \
          --output "$BASHKITTEN_COMPANION_LICENSES"
      if: (success()) && steps.component.outputs.hit != 'true'
    - name: Assemble the release browser
      working-directory: browser
      run: set -o pipefail; ./mach gradle :fenix:assembleRelease 2>&1 | tee ../artifacts/apk-build.log
      if: (success()) && steps.component.outputs.hit != 'true'
    - name: Sign, verify and collect the production APK
      run: python3 browser/bashkitten/android/scripts/collect-artifacts.py candidate
      if: (success()) && steps.component.outputs.hit != 'true'
    - name: Verify the Android artifact and source inputs
      run: python3 agent/packaging/browser-component.py verify android --directory candidate
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ steps.component.outputs.artifact }}
        path: candidate/
        compression-level: 0
        if-no-files-found: error
    - name: Save Gradle dependency downloads
      if: (always() && !cancelled() && steps.toolchain-cache.outputs.cache-hit != 'true') && steps.component.outputs.hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.gradle/caches/modules-2
          ~/.gradle/wrapper
        key: bashkitten-android-gradle-downloads-v1-${{ runner.os }}-${{ hashFiles('browser/gradle/libs.versions.toml', 'browser/mobile/android/android-components/.config.yml', 'browser/mobile/android/*/build.gradle',
          'browser/mobile/android/fenix/app/build.gradle', 'browser/python/mozboot/mozboot/android.py', 'browser/python/mozboot/mozboot/mozconfig.py') }}
    - name: Remove staged signing key
      if: (always()) && steps.component.outputs.hit != 'true'
      run: rm -f "$BASHKITTEN_PUBLISHER_KEYSTORE"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always() && steps.component.outputs.hit != 'true'
      with:
        name: compiler-cache-statistics
        path: artifacts/sccache-gecko.json
        if-no-files-found: ignore
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: failure()
      with:
        name: android-build-logs
        path: artifacts/
        if-no-files-found: ignore
