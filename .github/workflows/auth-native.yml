name: Native authentication components
'on':
  workflow_dispatch:
    inputs:
      component:
        type: choice
        default: all
        options: [all, authelia, caddy, tor, valkey, chisel, remote]
      target:
        type: choice
        default: all
        options: [all, linux-amd64, linux-arm64, termux-aarch64, termux-x86_64]
      force_rebuild:
        type: boolean
        default: false
  workflow_call:
    inputs:
      force_rebuild:
        type: boolean
        default: false
    secrets:
      BUILD_REPOS_TOKEN:
        required: true
  push:
    branches: [main]
    paths: ['auth/**', 'agent/native/remote/**', 'agent/src/server/access/runtime-guard.c', '.github/workflows/auth-native.yml']
permissions:
  contents: read
  actions: read
jobs:
  components:
    uses: ./.github/workflows/build-components.yml
    with:
      components: ${{ inputs.component && inputs.component != 'all' && format('["auth-{0}","auth"]', inputs.component) || '["auth"]' }}
      target: ${{ inputs.target || 'all' }}
      force_rebuild: ${{ inputs.force_rebuild || false }}
    secrets:
      BUILD_REPOS_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
