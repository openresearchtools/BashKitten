name: Native authentication components

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to build (individual builds upload only that component)
        type: choice
        default: all
        options: [all, authelia, caddy, tor, valkey, chisel, remote]
      target:
        description: Target ABI
        type: choice
        default: all
        options: [all, linux-amd64, linux-arm64, termux-aarch64, termux-x86_64]
      force_rebuild:
        description: Build native inputs without restoring completed artifacts
        type: boolean
        default: false
  workflow_call:
    inputs:
      force_rebuild:
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['auth/**', 'agent/native/remote/**', 'agent/src/server/access/runtime-guard.c', '.github/workflows/auth-native.yml']

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.reuse.outputs.build }}
      matrix: ${{ steps.reuse.outputs.matrix }}
      targets: ${{ steps.reuse.outputs.targets }}
      restore: ${{ steps.reuse.outputs.restore }}
      restores: ${{ steps.reuse.outputs.restores }}
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: agent/packaging
      - name: Restore unchanged complete authentication stacks
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 agent/packaging/native-component.py plan-auth '${{ inputs.component || 'all' }}' '${{ inputs.target || 'all' }}' --directory "$RUNNER_TEMP/restored" --force '${{ inputs.force_rebuild }}'
  aggregate:
    needs: plan
    if: needs.plan.outputs.restore == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.restores) }}
    runs-on: ${{ matrix.target == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      GOTELEMETRY: 'off'
      DO_NOT_TRACK: '1'
      TASKARIAN_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: agent/packaging
      - name: Restore selected complete authentication artifact
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 agent/packaging/native-component.py restore auth '${{ matrix.target }}' --artifact '${{ matrix.artifact }}' --directory "$RUNNER_TEMP/artifacts"
      - name: Recover independent native component checkpoints after an aggregate miss
        if: steps.reuse.outputs.hit != 'true'
        id: checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for component in authelia caddy tor valkey chisel remote; do
            python3 agent/packaging/native-component.py restore "auth-$component" '${{ matrix.target }}' --directory "$RUNNER_TEMP/components/auth-component-$component-${{ matrix.target }}" --output-name "hit_$component"
          done
      - name: Materialize source for missing aggregate assembly
        if: steps.reuse.outputs.hit != 'true'
        run: GIT_LFS_SKIP_SMUDGE=1 git sparse-checkout set auth agent/native/remote agent/packaging agent/src/server/access
      - uses: actions/setup-go@v6
        if: steps.reuse.outputs.hit != 'true' && (steps.checkpoints.outputs.hit_authelia != 'true' || steps.checkpoints.outputs.hit_caddy != 'true' || steps.checkpoints.outputs.hit_tor != 'true' || steps.checkpoints.outputs.hit_valkey != 'true' || steps.checkpoints.outputs.hit_chisel != 'true' || steps.checkpoints.outputs.hit_remote != 'true')
        with:
          go-version: '1.27.2'
          cache-dependency-path: agent/native/remote/go.sum
      - uses: actions/setup-node@v4
        if: steps.reuse.outputs.hit != 'true' && steps.checkpoints.outputs.hit_authelia != 'true'
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        if: steps.reuse.outputs.hit != 'true' && steps.checkpoints.outputs.hit_authelia != 'true'
        with:
          version: '12'
      - name: Native build prerequisites after an artifact miss
        if: steps.reuse.outputs.hit != 'true' && (steps.checkpoints.outputs.hit_authelia != 'true' || steps.checkpoints.outputs.hit_caddy != 'true' || steps.checkpoints.outputs.hit_tor != 'true' || steps.checkpoints.outputs.hit_valkey != 'true' || steps.checkpoints.outputs.hit_chisel != 'true' || steps.checkpoints.outputs.hit_remote != 'true')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake autoconf automake libtool pkg-config libevent-dev libssl-dev zlib1g-dev liblzma-dev libzstd-dev libseccomp-dev python3 python3-yaml binutils dpkg-dev
      - name: Build missing authelia checkpoint
        if: steps.reuse.outputs.hit != 'true' && steps.checkpoints.outputs.hit_authelia != 'true'
        run: |
          auth/build/authelia.sh '${{ matrix.target }}' "$RUNNER_TEMP/payload-authelia"
          mkdir -p "$RUNNER_TEMP/components/auth-component-authelia-${{ matrix.target }}"
          tar -C "$RUNNER_TEMP/payload-authelia" -czf "$RUNNER_TEMP/components/auth-component-authelia-${{ matrix.target }}/component.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.hit != 'true'
        with:
          name: auth-component-authelia-${{ matrix.target }}
          path: ${{ runner.temp }}/components/auth-component-authelia-${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Build missing caddy checkpoint
        if: steps.reuse.outputs.hit != 'true' && steps.checkpoints.outputs.hit_caddy != 'true'
        run: |
          auth/build/caddy.sh '${{ matrix.target }}' "$RUNNER_TEMP/payload-caddy"
          mkdir -p "$RUNNER_TEMP/components/auth-component-caddy-${{ matrix.target }}"
          tar -C "$RUNNER_TEMP/payload-caddy" -czf "$RUNNER_TEMP/components/auth-component-caddy-${{ matrix.target }}/component.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.hit != 'true'
        with:
          name: auth-component-caddy-${{ matrix.target }}
          path: ${{ runner.temp }}/components/auth-component-caddy-${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Build missing tor checkpoint
        if: steps.reuse.outputs.hit != 'true' && steps.checkpoints.outputs.hit_tor != 'true'
        run: |
          auth/build/tor.sh '${{ matrix.target }}' "$RUNNER_TEMP/payload-tor"
          mkdir -p "$RUNNER_TEMP/components/auth-component-tor-${{ matrix.target }}"
          tar -C "$RUNNER_TEMP/payload-tor" -czf "$RUNNER_TEMP/components/auth-component-tor-${{ matrix.target }}/component.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.hit != 'true'
        with:
          name: auth-component-tor-${{ matrix.target }}
          path: ${{ runner.temp }}/components/auth-component-tor-${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Build missing valkey checkpoint
        if: steps.reuse.outputs.hit != 'true' && steps.checkpoints.outputs.hit_valkey != 'true'
        run: |
          auth/build/valkey.sh '${{ matrix.target }}' "$RUNNER_TEMP/payload-valkey"
          mkdir -p "$RUNNER_TEMP/components/auth-component-valkey-${{ matrix.target }}"
          tar -C "$RUNNER_TEMP/payload-valkey" -czf "$RUNNER_TEMP/components/auth-component-valkey-${{ matrix.target }}/component.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.hit != 'true'
        with:
          name: auth-component-valkey-${{ matrix.target }}
          path: ${{ runner.temp }}/components/auth-component-valkey-${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Build missing chisel checkpoint
        if: steps.reuse.outputs.hit != 'true' && steps.checkpoints.outputs.hit_chisel != 'true'
        run: |
          auth/build/chisel.sh '${{ matrix.target }}' "$RUNNER_TEMP/payload-chisel"
          mkdir -p "$RUNNER_TEMP/components/auth-component-chisel-${{ matrix.target }}"
          tar -C "$RUNNER_TEMP/payload-chisel" -czf "$RUNNER_TEMP/components/auth-component-chisel-${{ matrix.target }}/component.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.hit != 'true'
        with:
          name: auth-component-chisel-${{ matrix.target }}
          path: ${{ runner.temp }}/components/auth-component-chisel-${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Build missing remote checkpoint
        if: steps.reuse.outputs.hit != 'true' && steps.checkpoints.outputs.hit_remote != 'true'
        run: |
          auth/build/remote.sh '${{ matrix.target }}' "$RUNNER_TEMP/payload-remote"
          mkdir -p "$RUNNER_TEMP/components/auth-component-remote-${{ matrix.target }}"
          tar -C "$RUNNER_TEMP/payload-remote" -czf "$RUNNER_TEMP/components/auth-component-remote-${{ matrix.target }}/component.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: steps.reuse.outputs.hit != 'true'
        with:
          name: auth-component-remote-${{ matrix.target }}
          path: ${{ runner.temp }}/components/auth-component-remote-${{ matrix.target }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Restore shared pinned authentication source archives
        if: steps.reuse.outputs.hit != 'true'
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/source-cache
          key: auth-source-archives-${{ hashFiles('auth/dependencies/**/sources.json') }}
      - name: Assemble after an absent or invalid aggregate artifact
        if: steps.reuse.outputs.hit != 'true'
        env:
          TASKARIAN_SOURCE_CACHE: ${{ runner.temp }}/source-cache
        run: |
          mkdir -p "$RUNNER_TEMP/payload"
          for archive in "$RUNNER_TEMP"/components/*/component.tar.gz; do
            tar -xzf "$archive" -C "$RUNNER_TEMP/payload"
          done
          python3 auth/build/assemble.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/payload" '${{ matrix.target }}' "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/components"
      - name: Preserve verified shared source downloads
        if: always() && steps.source-cache.outcome == 'success' && steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/source-cache
          key: ${{ steps.source-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: auth-${{ matrix.target }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  guard:
    if: ${{ !inputs.component || inputs.component == 'all' }}
    name: Runtime guard · ${{ matrix.architecture }}
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: agent/src/server/access
      - name: Build lifecycle guard independently of the web assets
        run: |
          mkdir -p "$RUNNER_TEMP/guard/bin"
          cc -std=c11 -Wall -Wextra -Werror -O2 agent/src/server/access/runtime-guard.c -o "$RUNNER_TEMP/guard/bin/runtime-guard"
          tar -C "$RUNNER_TEMP/guard" -czf "$RUNNER_TEMP/runtime-guard.tar.gz" bin
      - uses: actions/upload-artifact@v4
        with:
          name: auth-guard-linux-${{ matrix.architecture }}
          path: ${{ runner.temp }}/runtime-guard.tar.gz
          if-no-files-found: error
          retention-days: 14
  component:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: ${{ matrix.component }} · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.target == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      GOTELEMETRY: 'off'
      DO_NOT_TRACK: '1'
      TASKARIAN_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: agent/packaging
      - name: Restore unchanged native component before installing build tools
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 agent/packaging/native-component.py restore 'auth-${{ matrix.component }}' '${{ matrix.target }}' --directory "$RUNNER_TEMP/component" --force '${{ inputs.force_rebuild }}'
      - name: Materialize changed authentication sources
        if: steps.reuse.outputs.hit != 'true'
        run: python3 agent/packaging/native-component.py materialize 'auth-${{ matrix.component }}' '${{ matrix.target }}' --directory "$RUNNER_TEMP/component"
      - uses: actions/setup-go@v6
        if: steps.reuse.outputs.hit != 'true' && (matrix.component == 'authelia' || matrix.component == 'caddy' || matrix.component == 'chisel' || matrix.component == 'remote')
        with:
          go-version: '1.27.2'
          cache-dependency-path: ${{ matrix.component == 'remote' && 'agent/native/remote/go.sum' || format('auth/{0}/go.sum', matrix.component) }}
      - uses: actions/setup-node@v4
        if: steps.reuse.outputs.hit != 'true' && matrix.component == 'authelia'
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        if: steps.reuse.outputs.hit != 'true' && matrix.component == 'authelia'
        with:
          version: '12'
      - name: Native build prerequisites
        if: steps.reuse.outputs.hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake autoconf automake libtool pkg-config libevent-dev libssl-dev zlib1g-dev liblzma-dev libzstd-dev libseccomp-dev python3 python3-yaml binutils dpkg-dev
      - uses: actions/cache@v4
        if: steps.reuse.outputs.hit != 'true'
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/Taskarian/termux
          key: auth-${{ matrix.component }}-${{ matrix.target }}-${{ hashFiles('auth/upstreams.lock.json', 'auth/build/**', 'auth/*-termux/**', 'auth/authelia/web/pnpm-lock.yaml') }}
      - name: Build tracked source for the target ABI
        if: steps.reuse.outputs.hit != 'true'
        env:
          COMPONENT: ${{ matrix.component }}
          TARGET: ${{ matrix.target }}
          TASKARIAN_BUILD_LOG_DIR: ${{ runner.temp }}/build-logs
        run: |
          auth/build/"$COMPONENT".sh "$TARGET" "$RUNNER_TEMP/payload"
      - name: Retain failed native configure logs
        if: failure() && startsWith(matrix.target, 'termux-')
        uses: actions/upload-artifact@v4
        with:
          name: auth-build-logs-${{ matrix.component }}-${{ matrix.target }}
          path: ${{ runner.temp }}/build-logs
          if-no-files-found: ignore
          retention-days: 14
      - name: Check native ELF compatibility
        if: steps.reuse.outputs.hit != 'true'
        env:
          COMPONENT: ${{ matrix.component }}
          TARGET: ${{ matrix.target }}
        run: |
          executable="$COMPONENT"
          if [[ "$COMPONENT" == valkey ]]; then executable=valkey-server; fi
          if [[ "$COMPONENT" == remote ]]; then executable=taskarian-remote; fi
          readelf -h "$RUNNER_TEMP/payload/bin/$executable"
          readelf -lW "$RUNNER_TEMP/payload/bin/$executable"
          if [[ "$TARGET" == termux-* ]]; then
            python3 - "$RUNNER_TEMP/payload/bin" <<'PY'
          from pathlib import Path
          import subprocess, sys
          for binary in Path(sys.argv[1]).iterdir():
              output = subprocess.check_output(['readelf', '-lW', str(binary)], text=True)
              loads = [line.split() for line in output.splitlines() if line.strip().startswith('LOAD ')]
              assert loads and all(int(line[-1], 16) >= 16384 for line in loads), f'{binary}: ELF requires 16 KB compatible load segments'
              assert '/system/bin/linker64' in output, f'{binary}: Termux executable must use the Android dynamic linker'
          PY
          fi
      - name: Archive component
        if: steps.reuse.outputs.hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/component"
          tar -C "$RUNNER_TEMP/payload" -czf "$RUNNER_TEMP/component/component.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: auth-component-${{ matrix.component }}-${{ matrix.target }}
          path: ${{ runner.temp }}/component/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  assemble:
    # A partial component dispatch cannot claim or upload a complete auth stack.
    if: ${{ !cancelled() && needs.plan.outputs.build == 'true' && needs.component.result == 'success' && (!inputs.component || inputs.component == 'all') }}
    needs: [plan, component]
    strategy:
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            auth
            agent/native/remote
            agent/packaging
            agent/src/server/access
      - name: Restore shared pinned authentication source archives
        id: source-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/source-cache
          # Original source bytes are identical across all four target ABIs.
          key: auth-source-archives-${{ hashFiles('auth/dependencies/**/sources.json') }}
      - uses: actions/download-artifact@v4
        with:
          pattern: auth-component-*-${{ matrix.target }}
          path: ${{ runner.temp }}/components
      - name: Assemble private runtime, notices and source
        env:
          TARGET: ${{ matrix.target }}
          TASKARIAN_SOURCE_CACHE: ${{ runner.temp }}/source-cache
        run: |
          mkdir -p "$RUNNER_TEMP/payload"
          for archive in "$RUNNER_TEMP"/components/*/component.tar.gz; do
            tar -xzf "$archive" -C "$RUNNER_TEMP/payload"
          done
          python3 auth/build/assemble.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/payload" "$TARGET" "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/components"
      - name: Preserve verified shared source downloads
        if: always() && steps.source-cache.outcome == 'success' && steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/source-cache
          key: ${{ steps.source-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: auth-${{ matrix.target }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
