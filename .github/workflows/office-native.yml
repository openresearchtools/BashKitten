name: Build independent Office, Files and References components
'on':
  workflow_dispatch:
    inputs:
      target:
        type: string
        default: all
      force_rebuild:
        type: boolean
        default: false
  workflow_call:
    inputs:
      target:
        type: string
        default: all
      force_rebuild:
        type: boolean
        default: false
    secrets:
      BUILD_REPOS_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  components:
    uses: ./.github/workflows/build-components.yml
    with:
      components: '["office-engine","office-server","office-ui","office-integration","files-server","files-ui","files-media","files-office-addon","files-integration","references"]'
      target: ${{ inputs.target }}
      force_rebuild: ${{ inputs.force_rebuild }}
    secrets: inherit
