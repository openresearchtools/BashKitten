name: Private Node runtimes
'on':
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild selected components instead of reusing published outputs
        type: boolean
        default: false
  workflow_call:
    inputs:
      force_rebuild:
        type: boolean
        default: false
    secrets:
      BUILD_REPOS_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  components:
    uses: ./.github/workflows/build-components.yml
    with:
      components: '["node"]'
      target: all
      force_rebuild: ${{ inputs.force_rebuild || false }}
    secrets:
      BUILD_REPOS_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
