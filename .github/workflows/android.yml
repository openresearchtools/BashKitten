name: Android browser candidates
'on':
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild native inputs instead of reusing published components
        default: false
        type: boolean
  workflow_call:
    inputs:
      force_rebuild:
        default: false
        type: boolean
    secrets:
      BUILD_REPOS_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        target: ['android', 'android-x86_64']
    uses: ./.github/workflows/remote-browser.yml
    with:
      target: ${{ matrix.target }}
      force_rebuild: ${{ inputs.force_rebuild }}
    secrets:
      BUILD_REPOS_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
