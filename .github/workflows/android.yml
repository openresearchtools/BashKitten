name: Android browser candidate
'on':
  workflow_dispatch:
    inputs:
      auth_run:
        description: Successful native-auth run containing native auth artifacts for both Termux architectures
        required: true
        type: string
      search_run:
        description: Successful native-search run containing native search artifacts for both Termux architectures
        required: true
        type: string
  workflow_call:
    inputs:
      auth_run:
        default: ''
        type: string
      search_run:
        default: ''
        type: string
    secrets:
      BUILD_REPOS_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        target: [android, android-x86_64]
    uses: ./.github/workflows/remote-browser.yml
    with:
      target: ${{ matrix.target }}
      auth_run: ${{ inputs.auth_run }}
      search_run: ${{ inputs.search_run }}
    secrets:
      BUILD_REPOS_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
