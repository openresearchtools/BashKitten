name: Android browser candidate
'on':
  workflow_dispatch:
    inputs:
      auth_run:
        description: Successful native-auth run containing auth-termux-aarch64
        required: true
        type: string
      search_run:
        description: Successful native-search run containing search-runtime-termux-aarch64
        required: true
        type: string
  workflow_call:
    inputs:
      auth_run:
        default: ''
        type: string
      search_run:
        default: ''
        type: string
    secrets:
      BUILD_REPOS_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  android:
    uses: ./.github/workflows/remote-browser.yml
    with:
      target: android
      auth_run: ${{ inputs.auth_run }}
      search_run: ${{ inputs.search_run }}
    secrets:
      BUILD_REPOS_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
