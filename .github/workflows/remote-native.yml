name: Native remote core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent/native/remote/**'
      - 'auth/chisel/**'
      - 'auth/age/**'
      - 'auth/barcode/**'
      - 'auth/gozxing/**'
      - 'auth/build/**'
      - 'auth/remote-termux/**'
      - '.github/workflows/remote-native.yml'

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            os: linux
            arch: amd64
            tags: ''
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            tags: ''
          - target: android-arm64-client
            runner: ubuntu-24.04
            os: android
            arch: arm64
            tags: bashkitten_client
    runs-on: ${{ matrix.runner }}
    env:
      GOTELEMETRY: 'off'
      GOTOOLCHAIN: local
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            agent/native/remote
            auth/chisel
            auth/age
            auth/barcode
            auth/gozxing
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: agent/native/remote/go.sum
      - name: Compile the shared source and verify module integrity
        working-directory: agent/native/remote
        env:
          BUILD_TAGS: ${{ matrix.tags }}
        run: |
          go mod verify
          go build -mod=readonly -trimpath -tags "$BUILD_TAGS" ./...
          go list -mod=readonly -deps -tags "$BUILD_TAGS" ./... > "$RUNNER_TEMP/remote-packages.txt"
          test -z "$(gofmt -l bundle tunnel host cmd oauth)"
      - uses: actions/upload-artifact@v4
        with:
          name: remote-package-inventory-${{ matrix.target }}
          path: ${{ runner.temp }}/remote-packages.txt
          if-no-files-found: error

  host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: termux-aarch64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GOTELEMETRY: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            agent/native/remote
            auth/chisel
            auth/age
            auth/barcode
            auth/gozxing
            auth/build
            auth/remote-termux
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: agent/native/remote/go.sum
      - name: Build the private native host and collect linked source/notices
        env:
          TARGET: ${{ matrix.target }}
        run: |
          auth/build/remote.sh "$TARGET" "$RUNNER_TEMP/payload"
          readelf -h "$RUNNER_TEMP/payload/bin/bashkitten-remote"
          readelf -lW "$RUNNER_TEMP/payload/bin/bashkitten-remote"
          if [[ "$TARGET" == termux-aarch64 ]]; then
            python3 - "$RUNNER_TEMP/payload/bin/bashkitten-remote" <<'PY'
          import subprocess, sys
          output = subprocess.check_output(['readelf', '-lW', sys.argv[1]], text=True)
          loads = [line.split() for line in output.splitlines() if line.strip().startswith('LOAD ')]
          assert loads and all(int(line[-1], 16) >= 16384 for line in loads), '16 KB alignment required'
          assert '/system/bin/linker64' in output, 'Android linker required'
          PY
          fi
      - name: Archive executable, notices and corresponding source
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          tar -czf "$RUNNER_TEMP/artifacts/remote-$TARGET-source.tar.gz" \
            agent/native/remote auth/chisel auth/age auth/barcode auth/gozxing \
            auth/build auth/remote-termux auth/upstreams.lock.json LICENSE \
            -C "$RUNNER_TEMP/payload/share" source metadata
          rm -r "$RUNNER_TEMP/payload/share/source"
          tar -C "$RUNNER_TEMP/payload" -czf "$RUNNER_TEMP/artifacts/remote-$TARGET.tar.gz" .
          cd "$RUNNER_TEMP/artifacts"
          sha256sum ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: remote-host-${{ matrix.target }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
          compression-level: 0
