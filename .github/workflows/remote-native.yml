name: Native remote core

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'agent/native/remote/**'
      - 'auth/chisel/**'
      - 'auth/age/**'
      - 'auth/barcode/**'
      - 'auth/gozxing/**'
      - 'auth/mobile/**'
      - 'auth/build/**'
      - 'auth/remote-termux/**'
      - 'browser/mobile/android/bashkitten/src/main/java/com/bashkitten/NativeRemote.java'
      - 'browser/mobile/android/bashkitten/src/main/java/com/bashkitten/SecretStore.java'
      - '.github/workflows/remote-native.yml'

permissions:
  contents: read

jobs:
  compile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
            os: linux
            arch: amd64
            tags: ''
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            tags: ''
          - target: android-arm64-client
            runner: ubuntu-24.04
            os: android
            arch: arm64
            tags: bashkitten_client
    runs-on: ${{ matrix.runner }}
    env:
      GOTELEMETRY: 'off'
      GOTOOLCHAIN: local
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            agent/native/remote
            auth/chisel
            auth/age
            auth/barcode
            auth/gozxing
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: agent/native/remote/go.sum
      - name: Compile the shared source and verify module integrity
        working-directory: agent/native/remote
        env:
          BUILD_TAGS: ${{ matrix.tags }}
        run: |
          go mod verify
          go build -mod=readonly -trimpath -tags "$BUILD_TAGS" ./...
          go list -mod=readonly -deps -tags "$BUILD_TAGS" ./... > "$RUNNER_TEMP/remote-packages.txt"
          test -z "$(gofmt -l bundle tunnel host cmd oauth client mobile)"
      - uses: actions/upload-artifact@v4
        with:
          name: remote-package-inventory-${{ matrix.target }}
          path: ${{ runner.temp }}/remote-packages.txt
          if-no-files-found: error
  android-library:
    runs-on: ubuntu-24.04
    env:
      GOTELEMETRY: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            agent/native/remote
            auth/chisel
            auth/age
            auth/barcode
            auth/gozxing
            auth/mobile
            auth/build
            browser/mobile/android/bashkitten/src/main/java/com/bashkitten
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: agent/native/remote/android/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned Android build toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;29.0.14206865' 'platforms;android-31'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Build native Java client, source and notices
        run: bash auth/build/remote-android.sh "$RUNNER_TEMP/remote-android"
      - name: Compile the native encrypted-store adapter against the generated binding
        run: |
          mkdir -p "$RUNNER_TEMP/remote-java"
          unzip -p "$RUNNER_TEMP/remote-android/bashkitten-remote.aar" classes.jar > "$RUNNER_TEMP/remote-java/binding.jar"
          javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-31/android.jar:$RUNNER_TEMP/remote-java/binding.jar" \
            -d "$RUNNER_TEMP/remote-java/classes" \
            browser/mobile/android/bashkitten/src/main/java/com/bashkitten/SecretStore.java \
            browser/mobile/android/bashkitten/src/main/java/com/bashkitten/NativeRemote.java \
            browser/mobile/android/bashkitten/src/main/java/com/bashkitten/TorGateway.java
      - uses: actions/upload-artifact@v4
        with:
          name: remote-client-android-arm64
          path: ${{ runner.temp }}/remote-android
          if-no-files-found: error
