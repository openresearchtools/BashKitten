name: Complete BashKitten candidates
'on':
  workflow_dispatch:
    inputs:
      warm_gkrust:
        description: Warm the desktop Rust compiler cache
        default: false
        type: boolean
      linux_only:
        description: Build Linux browser packages without rebuilding the Android APK
        default: false
        type: boolean
      native_only:
        description: Build native components and the Termux package without Gecko
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: complete-candidates-${{ github.ref }}-${{ github.sha }}-${{ inputs.native_only }}-${{ inputs.linux_only }}
  cancel-in-progress: false
jobs:
  auth:
    uses: ./.github/workflows/auth-native.yml
  search:
    uses: ./.github/workflows/search-native.yml
  browser_arm64:
    if: ${{ !inputs.native_only }}
    uses: ./.github/workflows/remote-browser.yml
    with:
      target: linux-arm64
      warm_gkrust: ${{ inputs.warm_gkrust }}
    secrets:
      BUILD_REPOS_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
  browser_amd64:
    if: ${{ !inputs.native_only }}
    uses: ./.github/workflows/remote-browser.yml
    with:
      target: linux-amd64
      warm_gkrust: ${{ inputs.warm_gkrust }}
    secrets:
      BUILD_REPOS_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
  android:
    if: ${{ !inputs.native_only && !inputs.linux_only }}
    uses: ./.github/workflows/android.yml
    secrets: inherit
  termux:
    needs:
    - auth
    - search
    runs-on: ubuntu-24.04
    env:
      PI_TELEMETRY: '0'
      PI_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install assembly tools
      run: sudo apt-get update && sudo apt-get install -y zstd python3
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: auth-termux-aarch64
        path: inputs/auth
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: search-runtime-termux-aarch64
        path: inputs/search
    - name: Assemble native Termux package
      run: |
        python3 agent/packaging/build.py termux \
          --architecture aarch64 --output dist \
          --auth-archive inputs/auth/auth-termux-aarch64.tar.gz \
          --search-archive inputs/search/search-runtime-termux-aarch64.tar.zst
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bashkitten-termux-aarch64-candidate
        path: dist/
        if-no-files-found: error
        compression-level: 0
  sources:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Collect exact product and locked npm source
      run: python3 agent/packaging/sources.py "$RUNNER_TEMP/sources"
    - name: Collect retained adblock corresponding source
      run: |
        python3 -I -B browser/bashkitten/scripts/blocker_asset_provenance.py build \
          --repository "$GITHUB_WORKSPACE/browser" \
          --cache-dir "$RUNNER_TEMP/blocker-source-cache" \
          --output "$RUNNER_TEMP/sources/bashkitten-blocker-assets-source.tar.xz" \
          --skip-reproduction-check
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bashkitten-corresponding-source
        path: ${{ runner.temp }}/sources/
        if-no-files-found: error
        compression-level: 0
  complete:
    needs:
    - auth
    - search
    - browser_arm64
    - browser_amd64
    - android
    - termux
    - sources
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        path: candidates
    - name: Verify four primary binaries and source inventory
      run: python3 agent/packaging/release.py candidates release --candidate-only
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bashkitten-complete-candidate
        path: release/
        if-no-files-found: error
        compression-level: 0
