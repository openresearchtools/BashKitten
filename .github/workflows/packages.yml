name: Complete Taskarian candidates
'on':
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild selected components instead of reusing published outputs
        default: false
        type: boolean
      components:
        description: Component IDs as JSON; all checks every component and builds only missing outputs
        default: '["all"]'
        type: string
      warm_gkrust:
        description: Warm the Rust cache when a desktop native engine build is needed
        default: false
        type: boolean
      linux_only:
        description: Build Linux applications without Android APKs
        default: false
        type: boolean
      native_only:
        description: Build reusable components and Termux packages without Gecko
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: complete-candidates-${{ github.ref }}-${{ github.sha }}-${{ inputs.native_only }}-${{ inputs.linux_only }}
  cancel-in-progress: false
jobs:
  builders:
    strategy:
      fail-fast: false
      matrix:
        target: [linux-amd64, linux-arm64, termux-aarch64, termux-x86_64]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /agent/packaging/*.py
          /browser/taskarian/config/version.txt
    - name: Coordinate the architecture builder
      env:
        GH_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
        TARGET: ${{ matrix.target }}
        COMPONENTS: ${{ inputs.components }}
        FORCE: ${{ inputs.force_rebuild }}
        NATIVE_ONLY: ${{ inputs.native_only }}
        LINUX_ONLY: ${{ inputs.linux_only }}
        WARM_GKRUST: ${{ inputs.warm_gkrust }}
      run: |
        flags=()
        if [ "$FORCE" = true ]; then flags+=(--force-rebuild); fi
        if [ "$NATIVE_ONLY" = true ]; then flags+=(--native-only); fi
        if [ "$LINUX_ONLY" = true ]; then flags+=(--linux-only); fi
        if [ "$WARM_GKRUST" = true ]; then flags+=(--warm-gkrust); fi
        python3 agent/packaging/remote-components.py build "$TARGET" --components "$COMPONENTS" "${flags[@]}"
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /agent/packaging/*.py
          /browser/taskarian/config/version.txt
    - name: Coordinate matching sources in the AMD64 builder
      env:
        GH_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
      run: python3 agent/packaging/remote-components.py sources
  complete:
    if: ${{ !inputs.native_only && !inputs.linux_only }}
    needs: [builders, sources]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /agent/packaging/
          /agent/src/server/platform/termux/updates-prepare.py
          /browser/taskarian/config/version.txt
          /browser/browser/config/version_display.txt
          /README.md
    - name: Download exact applications and sources by direct release URLs
      run: python3 agent/packaging/remote-components.py collect --directory candidates
    - name: Verify six primary binaries and complete source inventory
      run: python3 agent/packaging/release.py candidates release --candidate-only
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: taskarian-complete-candidate
        path: release/
        if-no-files-found: error
        compression-level: 0
