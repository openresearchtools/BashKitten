name: Complete BashKitten candidates
'on':
  workflow_dispatch:
    inputs:
      warm_gkrust:
        description: Warm the desktop Rust compiler cache
        default: false
        type: boolean
      linux_only:
        description: Build Linux browser packages without rebuilding the Android APK
        default: false
        type: boolean
      native_only:
        description: Build native components and the Termux package without Gecko
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: complete-candidates-${{ github.ref }}-${{ github.sha }}-${{ inputs.native_only }}-${{ inputs.linux_only }}
  cancel-in-progress: false
jobs:
  auth:
    uses: ./.github/workflows/auth-native.yml
  search:
    uses: ./.github/workflows/search-native.yml
  node:
    uses: ./.github/workflows/node-native.yml
  office:
    uses: ./.github/workflows/office-native.yml
    secrets:
      BUILD_REPOS_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
  environments:
    uses: ./.github/workflows/machines-native.yml
  browser_arm64:
    if: ${{ !inputs.native_only }}
    uses: ./.github/workflows/remote-browser.yml
    with:
      target: linux-arm64
      warm_gkrust: ${{ inputs.warm_gkrust }}
    secrets:
      BUILD_REPOS_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
  browser_amd64:
    if: ${{ !inputs.native_only }}
    uses: ./.github/workflows/remote-browser.yml
    with:
      target: linux-amd64
      warm_gkrust: ${{ inputs.warm_gkrust }}
    secrets:
      BUILD_REPOS_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
  android:
    if: ${{ !inputs.native_only && !inputs.linux_only }}
    uses: ./.github/workflows/android.yml
    secrets: inherit
  termux:
    strategy:
      fail-fast: false
      matrix:
        architecture: [aarch64, x86_64]
    needs:
    - auth
    - search
    - node
    - environments
    - office
    runs-on: ubuntu-24.04
    env:
      PI_TELEMETRY: '0'
      PI_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Install assembly tools
      run: sudo apt-get update && sudo apt-get install -y zstd python3
    - name: Install the existing pinned Rust toolchain for Photon
      run: |
        version=$(python3 -c 'import json; print(json.load(open("agent/machines/rust-toolchain/sources.json"))["version"])')
        rustup toolchain install "$version" --profile minimal --component rust-docs --target wasm32-unknown-unknown
        printf '%s\n' "RUSTUP_TOOLCHAIN=$version" "BASHKITTEN_PHOTON_BUILD_CACHE=$RUNNER_TEMP/photon-cache" "BASHKITTEN_SOURCE_CACHE=$RUNNER_TEMP/source-cache" >> "$GITHUB_ENV"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: auth-termux-${{ matrix.architecture }}
        path: inputs/auth
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: search-runtime-termux-${{ matrix.architecture }}
        path: inputs/search
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: node-runtime-termux-${{ matrix.architecture }}
        path: inputs/node
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: display-loader-termux
        path: inputs/display
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: os-termux-${{ matrix.architecture }}
        path: inputs/os
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: office-termux-${{ matrix.architecture }}
        path: inputs/office
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: files-termux-${{ matrix.architecture }}
        path: inputs/files
    - name: Assemble native Termux package
      run: |
        python3 agent/packaging/build.py termux \
          --architecture ${{ matrix.architecture }} --output dist \
          --auth-archive inputs/auth/auth-termux-${{ matrix.architecture }}.tar.gz \
          --search-archive inputs/search/search-runtime-termux-${{ matrix.architecture }}.tar.zst \
          --node-archive inputs/node/node-runtime-termux-${{ matrix.architecture }}.tar.gz \
          --office-archive inputs/office/office-termux-${{ matrix.architecture }}.tar.xz \
          --files-archive inputs/files/files-termux-${{ matrix.architecture }}.tar.gz \
          --termux-display-dir inputs/display \
          --os-package "$(find inputs/os -maxdepth 1 -name '*.deb')"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bashkitten-termux-${{ matrix.architecture }}-candidate
        path: dist/
        if-no-files-found: error
        compression-level: 0
  sources:
    needs: node
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        # The source serializer reads every committed blob directly from Git.
        # Materialize only its helpers and the blocker's existing verifier inputs.
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /agent/packaging/
          /auth/dependencies/**/sources.json
          /auth/dependencies/go/proxy/
          /files/go_runtime.py
          /files/vendor/dependencies/
          /browser/bashkitten/scripts/blocker_asset_provenance.py
          /browser/bashkitten/BLOCKER-ASSET-SOURCE-NOTICE
          /browser/browser/components/blocker/assets/
          /browser/browser/components/blocker/scripts/
    - name: Backfill the pinned source revision with native Git
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test "$(git rev-parse --is-shallow-repository)" = true
        test "$(git rev-list --all --count)" = 1
        git --version
        git backfill --no-sparse
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: node-runtime-*
        path: node-inputs
    - name: Reuse shared authentication source downloads
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/source-cache
        key: auth-source-archives-${{ hashFiles('auth/dependencies/**/sources.json') }}
        # Do not persist another multi-gigabyte copy of every component's
        # originals in the main repository's native compiler-cache budget.
    - name: Collect exact product and locked npm source
      run: python3 agent/packaging/sources.py "$RUNNER_TEMP/sources" --node-sources node-inputs --cache "$RUNNER_TEMP/source-cache"
    - name: Collect retained adblock corresponding source
      run: |
        python3 -I -B browser/bashkitten/scripts/blocker_asset_provenance.py build \
          --repository "$GITHUB_WORKSPACE/browser" \
          --cache-dir "$RUNNER_TEMP/blocker-source-cache" \
          --output "$RUNNER_TEMP/sources/bashkitten-blocker-assets-source.tar.xz" \
          --skip-reproduction-check
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bashkitten-corresponding-source
        path: ${{ runner.temp }}/sources/
        if-no-files-found: error
        compression-level: 0
  complete:
    needs:
    - auth
    - search
    - node
    - browser_arm64
    - browser_amd64
    - android
    - termux
    - sources
    - environments
    - office
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        # Package validation needs the full Git index for fingerprints, without
        # another materialized copy of the imported browser/Office sources.
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /agent/packaging/
          /agent/src/server/platform/termux/updates-prepare.py
          /browser/bashkitten/config/version.txt
          /browser/browser/config/version_display.txt
          /README.md
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        # Auth/search carry matching sources; Node sources are already in the
        # corresponding-source artifact. Other runtimes are inside the DEBs,
        # with their tracked source retained in the complete product archive.
        pattern: '{bashkitten-{android*,linux-*,termux-*}-candidate,bashkitten-corresponding-source,auth-linux-*,auth-termux-*,search-runtime-*,guest-packages-linux-*,os-termux-*}'
        path: candidates
    - name: Verify six primary binaries and source inventory
      run: python3 agent/packaging/release.py candidates release --candidate-only
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: bashkitten-complete-candidate
        path: release/
        if-no-files-found: error
        compression-level: 0
