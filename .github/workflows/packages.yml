name: Native Linux packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/server/**', 'licenses/**', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'src/web/**', 'src/linux/**', 'packaging/**', 'runtime-manifests/**', 'package*.json', '.github/workflows/packages.yml']
  pull_request:
    paths: ['src/server/**', 'licenses/**', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'src/web/**', 'src/linux/**', 'packaging/**', 'runtime-manifests/**', 'package*.json', '.github/workflows/packages.yml']
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78
    env:
      DEBIAN_FRONTEND: noninteractive
      PI_TELEMETRY: '0'
      PI_OFFLINE: '1'
      DO_NOT_TRACK: '1'
    steps:
      - name: Install package build tools
        run: |
          apt-get update
          apt-get install -y git ca-certificates nodejs npm python3 zstd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build server and desktop packages
        run: |
          test "$(dpkg --print-architecture)" = '${{ matrix.architecture }}'
          python3 packaging/build.py linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-${{ matrix.architecture }}-candidates
          path: dist/*.deb
          if-no-files-found: error
