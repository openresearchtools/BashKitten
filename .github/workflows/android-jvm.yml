# SPDX-License-Identifier: AGPL-3.0-or-later
name: Android Java and Kotlin
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-jvm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MOZCONFIG: ${{ github.workspace }}/wildbuzzard/android/mozconfig
      MOZBUILD_STATE_PATH: ${{ github.workspace }}-mozbuild
      ANDROID_NDK_HOME: ${{ github.workspace }}-mozbuild/android-ndk-r29
      PYTHONUNBUFFERED: '1'
      DISABLE_TELEMETRY: '1'
      RUSTUP_TOOLCHAIN: '1.96.0'
      MACH_SHOW_PIP_OUTPUT: '1'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx3g'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare build environment
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts "$MOZBUILD_STATE_PATH"
          cat > "$MOZBUILD_STATE_PATH/machrc" <<'EOF'
          [mach_telemetry]
          is_enabled = false
          is_set_up = true
          is_employee = false
          EOF
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev python3-venv libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdbus-glib-1-dev libdrm-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev m4 nasm unzip zip zstd
      - name: Restore Android toolchains and Gradle downloads
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.MOZBUILD_STATE_PATH }}
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/debug.keystore
          key: android-toolchain-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'mobile/android/android-components/.config.yml', 'mobile/android/*/build.gradle', 'mobile/android/fenix/app/build.gradle', 'python/mozboot/mozboot/android.py', 'python/mozboot/mozboot/mozconfig.py') }}
          restore-keys: |
            android-toolchain-v2-${{ runner.os }}-
            android-toolchain-v1-${{ runner.os }}-
      - name: Install compatible Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --target aarch64-linux-android
      - name: Bootstrap and generate Gecko bindings
        run: |
          set -Eeuo pipefail
          ./mach --no-interactive bootstrap --application-choice mobile_android 2>&1 | tee artifacts/bootstrap.log
          ./mach build pre-export export 2>&1 | tee artifacts/export.log
      - name: Compile Android product and independent agent tests
        run: |
          set -Eeuo pipefail
          ./mach gradle --continue :fenix:compileDebugKotlin :fenix:compileDebugJavaWithJavac :wildbuzzard-agent-probe:compileDebugJavaWithJavac :wildbuzzard-agent-probe:compileDebugAndroidTestJavaWithJavac 2>&1 | tee artifacts/jvm-build.log
      - name: Save Android toolchains and Gradle downloads
        if: always() && !cancelled() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.MOZBUILD_STATE_PATH }}
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/debug.keystore
          key: android-toolchain-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'mobile/android/android-components/.config.yml', 'mobile/android/*/build.gradle', 'mobile/android/fenix/app/build.gradle', 'python/mozboot/mozboot/android.py', 'python/mozboot/mozboot/mozconfig.py') }}
      - name: Preserve compilation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-jvm-${{ github.sha }}
          path: artifacts/
          retention-days: 14
