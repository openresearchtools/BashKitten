name: Prepare next release candidate
'on':
  workflow_dispatch:
    inputs:
      bump:
        description: Increment the Taskarian patch version for this app repackage
        default: true
        type: boolean
      warm_gkrust:
        description: Warm the desktop Rust compiler cache
        default: false
        type: boolean
permissions:
  contents: write
  actions: write
concurrency:
  group: prepare-product-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: openresearchtools/Taskarian
      WARM_GKRUST: ${{ inputs.warm_gkrust }}
      BUMP: ${{ inputs.bump }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: main
    - name: Prepare the next shared product version before building
      run: |
        flags=()
        if [ "$BUMP" = true ]; then flags+=(--bump); fi
        version=$(python3 -B agent/packaging/release_version.py prepare "${flags[@]}")
        if ! git diff --quiet; then
          git config user.name 'openresearchtools'
          git config user.email 'openresearchtools@gmail.com'
          git add browser/taskarian/config/version.txt agent/package.json agent/package-lock.json
          git commit -m "Prepare Taskarian $version release"
          git push origin HEAD:main
        fi
        printf 'Prepared Taskarian %s; publication remains a separate action.\n' "$version" >> "$GITHUB_STEP_SUMMARY"
    - name: Build complete candidates from the prepared main revision
      run: gh workflow run packages.yml --ref main -f "warm_gkrust=$WARM_GKRUST"
