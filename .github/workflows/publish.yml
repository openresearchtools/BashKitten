name: Publish testing release
'on':
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful Complete Taskarian candidates run to publish
        required: true
        type: string
      prerelease:
        description: Publish to nightly APT (off publishes to stable APT)
        default: true
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-testing-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: openresearchtools/Taskarian
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
    - name: Locate successful complete candidate
      id: candidate
      shell: bash
      run: |
        [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
        gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN" > "$RUNNER_TEMP/candidate.json"
        jq -e '.conclusion == "success" and .path == ".github/workflows/packages.yml" and .event == "workflow_dispatch"' "$RUNNER_TEMP/candidate.json"
        revision=$(jq -r .head_sha "$RUNNER_TEMP/candidate.json")
        [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
        printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ steps.candidate.outputs.revision }}
        persist-credentials: false
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /agent/packaging/
          /agent/src/server/platform/termux/updates-prepare.py
          /browser/taskarian/config/version.txt
          /browser/browser/config/version.txt
          /browser/browser/config/version_display.txt
          /browser/taskarian/upstreams.toml
          /browser/taskarian/scripts/firefox_release.py
          /README.md
          /LICENSE
    - name: Download small pinned release plan
      run: gh run download "$CANDIDATE_RUN" --name taskarian-complete-candidate --dir release-plan
    - name: Check version and publishing authority before installer downloads
      id: draft
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG_SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
        CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
      run: |
        python3 -B agent/packaging/release_version.py check
        python3 - <<'PY'
        import json, os, shlex, subprocess, tempfile
        from pathlib import Path
        repository = os.environ['GH_REPO']
        revision = os.environ['CANDIDATE_REVISION']
        tag = 'v' + Path('browser/taskarian/config/version.txt').read_text().strip()
        def api(route, body=None):
            command = ['gh', 'api', 'repos/' + repository + '/' + route]
            if body is not None:
                command += ['--method', 'POST', '--input', '-']
            result = subprocess.run(command, input=json.dumps(body) if body is not None else None,
                                    text=True, capture_output=True, check=False)
            if result.returncode:
                if body is None and 'HTTP 404' in result.stderr:
                    return None
                raise RuntimeError(result.stderr)
            return json.loads(result.stdout)
        ref = api('git/ref/tags/' + tag)
        if ref is None:
            # GITHUB_TOKEN cannot tag an older commit with different workflows.
            # This repository-only deploy key creates just the verified tag.
            private_key = os.environ.get('RELEASE_TAG_SSH_KEY', '')
            if not private_key:
                raise RuntimeError('The repository release-tag deploy key is required')
            host_keys = json.loads(subprocess.check_output(['gh', 'api', 'meta'], text=True))['ssh_keys']
            if not host_keys or any('\n' in key or '\r' in key for key in host_keys):
                raise RuntimeError('Invalid GitHub SSH host keys')
            with tempfile.TemporaryDirectory(prefix='taskarian-release-tag-') as directory:
                key = Path(directory) / 'key'
                key.write_text(private_key.rstrip('\r\n') + '\n')
                key.chmod(0o600)
                known_hosts = Path(directory) / 'known_hosts'
                known_hosts.write_text(''.join('[ssh.github.com]:443 ' + key + '\n' for key in host_keys))
                environment = os.environ.copy()
                environment.pop('RELEASE_TAG_SSH_KEY', None)
                environment['GIT_SSH_COMMAND'] = shlex.join([
                    'ssh', '-F', '/dev/null', '-i', str(key), '-o', 'IdentitiesOnly=yes',
                    '-o', 'StrictHostKeyChecking=yes', '-o', 'UserKnownHostsFile=' + str(known_hosts),
                    '-o', 'ConnectTimeout=30'])
                subprocess.run(['git', '-c', 'core.hooksPath=/dev/null', 'push', '--porcelain',
                                'ssh://git@ssh.github.com:443/' + repository + '.git',
                                revision + ':refs/tags/' + tag], env=environment, check=True)
            ref = api('git/ref/tags/' + tag)
        target = ref['object']
        seen = set()
        while target['type'] == 'tag':
            if target['sha'] in seen:
                raise RuntimeError('Cyclic release tag')
            seen.add(target['sha'])
            target = api('git/tags/' + target['sha'])['object']
        if target.get('type') != 'commit' or target.get('sha') != revision:
            raise RuntimeError('Release tag does not identify the successful candidate')
        # REST's release-by-tag route can hide drafts. Use the same draft-aware
        # lookup as the upload step so a failed publication can resume safely.
        lookup = subprocess.run(['gh', 'release', 'view', tag, '--json', 'isDraft'],
                                text=True, capture_output=True, check=False)
        if lookup.returncode and 'release not found' not in lookup.stderr.lower():
            raise RuntimeError(lookup.stderr)
        if lookup.returncode:
            subprocess.run(['gh', 'release', 'create', tag, '--verify-tag', '--draft', '--prerelease',
                            '--latest=false', '--title', 'Taskarian ' + tag[1:] + ' · Testing release',
                            '--notes', 'Preparing verified Taskarian installers.'], check=True)
        elif not json.loads(lookup.stdout)['isDraft']:
            raise RuntimeError('A published release is immutable; prepare a new product version')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('tag=' + tag + '\n')
        PY
    - name: Reclaim unused hosted runner toolchains
      run: |
        df -h /
        if [[ ${GITHUB_ACTIONS:-} == true && ${RUNNER_ENVIRONMENT:-} == github-hosted ]]; then
          android_sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          # Retain SDK build-tools and Java for the APK signature checks.
          for path in "$android_sdk/ndk" "$android_sdk/ndk-bundle" \
            "$android_sdk/emulator" "$android_sdk/system-images" \
            "$android_sdk/platforms" "$android_sdk/sources" \
            /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby /usr/local/share/boost; do
            if [[ -e "$path" ]]; then sudo rm -rf --one-file-system -- "$path"; fi
          done
        fi
        df -h /
    - name: Download shipped installers once and verify original native release contracts
      run: |
        python3 agent/packaging/remote-components.py materialize --plan release-plan/candidate-plan.json --directory candidates
        python3 agent/packaging/release.py candidates release --candidate-only --run "$CANDIDATE_RUN"
    - name: Verify artifacts and required testing notice
      id: release
      env:
        CANDIDATE_REVISION: ${{ steps.candidate.outputs.revision }}
      run: |
        cd release
        sha256sum --check SHA256SUMS
        python3 - <<'PY'
        import json, os, re
        from pathlib import Path
        release = json.loads(Path('release.json').read_text())
        notes = Path('release-notes.md').read_text()
        if any(not path.is_file() or path.stat().st_size >= 2 * 1024 ** 3 for path in Path('.').iterdir()):
            raise SystemExit('Release assets must be files smaller than 2 GiB; rebuild oversized source archives as checksummed parts')
        if release['sourceCommit'] != os.environ['CANDIDATE_REVISION']:
            raise SystemExit('Candidate source does not match the successful build')
        if not release.get('testingRelease') or 'testing-releases.svg' not in notes or 'Testing release only. Not ready for production.' not in notes:
            raise SystemExit('The testing release warning is required')
        version = Path('../browser/taskarian/config/version.txt').read_text().strip()
        if not re.fullmatch(r'v\d+\.\d+(?:\.\d+)?', release['tag']) or release['tag'] != 'v' + version or release['version'] != version or release['packageVersion'] != version:
            raise SystemExit('Invalid product release tag')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('tag=' + release['tag'] + '\n')
        PY
    - name: Require a newer version across stable and prerelease channels
      run: python3 -B agent/packaging/release_version.py check
    - name: Publish installers and permanent source/license index
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ steps.release.outputs.tag }}
        VERIFIED_TAG: ${{ steps.draft.outputs.tag }}
      run: |
        [[ "$RELEASE_TAG" == "$VERIFIED_TAG" ]]
        [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]
        gh release upload "$RELEASE_TAG" release/* --clobber
        flags=(--prerelease=false --latest)
        if [ "$PRERELEASE" = true ]; then flags=(--prerelease --latest=false); fi
        gh release edit "$RELEASE_TAG" --draft=false \
          --title "Taskarian ${RELEASE_TAG#v} · Testing release" \
          --notes-file release/release-notes.md "${flags[@]}"
