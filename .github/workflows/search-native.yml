name: Native search runtime
'on':
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild selected components instead of reusing published outputs
        type: boolean
        default: false
  workflow_call:
    inputs:
      force_rebuild:
        type: boolean
        default: false
    secrets:
      BUILD_REPOS_TOKEN:
        required: true
  push:
    branches: [main]
    paths: ['agent/search/**', 'agent/packaging/termux/search/**', '.github/workflows/search-native.yml']
permissions:
  contents: read
  actions: read
jobs:
  components:
    uses: ./.github/workflows/build-components.yml
    with:
      components: '["search"]'
      target: all
      force_rebuild: ${{ inputs.force_rebuild || false }}
    secrets:
      BUILD_REPOS_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
