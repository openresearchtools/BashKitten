# SPDX-License-Identifier: AGPL-3.0-or-later
name: Android UI APK with verified engine
on:
  workflow_dispatch:
    inputs:
      engine_run:
        description: Successful full ARM64 build run from this repository
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: android-ui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MOZCONFIG: ${{ github.workspace }}/wildbuzzard/android/mozconfig-artifact
      MOZ_ARTIFACT_FILE: ${{ github.workspace }}-engine/geckoview_example.apk
      WILDBUZZARD_ENGINE_PROVENANCE: ${{ github.workspace }}-engine/provenance.json
      MOZBUILD_STATE_PATH: ${{ github.workspace }}-mozbuild
      ANDROID_NDK_HOME: ${{ github.workspace }}-mozbuild/android-ndk-r29
      PYTHONUNBUFFERED: '1'
      DISABLE_TELEMETRY: '1'
      RUSTUP_TOOLCHAIN: '1.96.0'
      MACH_SHOW_PIP_OUTPUT: '1'
      SCCACHE_GHA_ENABLED: 'true'
      WILDBUZZARD_DEBUG_KEYSTORE: ${{ github.workspace }}-ci-debug.p12
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx3g'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare hosted runner
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts "$MOZBUILD_STATE_PATH"
          cat > "$MOZBUILD_STATE_PATH/machrc" <<'EOF'
          [mach_telemetry]
          is_enabled = false
          is_set_up = true
          is_employee = false
          EOF
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev python3-venv libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdbus-glib-1-dev libdrm-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev m4 nasm unzip zip zstd
          sudo fallocate -l 8G /mnt/wildbuzzard.swap
          sudo chmod 600 /mnt/wildbuzzard.swap
          sudo mkswap /mnt/wildbuzzard.swap
          sudo swapon /mnt/wildbuzzard.swap
          df -h
      - name: Restore Android toolchains and Gradle downloads
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.MOZBUILD_STATE_PATH }}
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-toolchain-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'mobile/android/android-components/.config.yml', 'mobile/android/*/build.gradle', 'mobile/android/fenix/app/build.gradle', 'python/mozboot/mozboot/android.py', 'python/mozboot/mozboot/mozconfig.py') }}
          restore-keys: |
            android-toolchain-v2-${{ runner.os }}-
            android-toolchain-v1-${{ runner.os }}-
      - name: Prepare explicit debug signing identity
        env:
          CI_DEBUG_KEYSTORE_B64: ${{ secrets.WILDBUZZARD_CI_DEBUG_KEYSTORE }}
        run: |
          set -Eeuo pipefail
          if [ -n "$CI_DEBUG_KEYSTORE_B64" ]; then
            python3 - <<'PY'
          import base64, os
          from pathlib import Path
          destination = Path(os.environ['WILDBUZZARD_DEBUG_KEYSTORE'])
          destination.write_bytes(base64.b64decode(os.environ['CI_DEBUG_KEYSTORE_B64'], validate=True))
          destination.chmod(0o600)
          PY
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            keytool -genkeypair -keystore "$WILDBUZZARD_DEBUG_KEYSTORE" -storetype PKCS12 -storepass android -alias androiddebugkey -keypass android -dname 'CN=Wild Buzzard Pull Request Debug,O=openresearchtools,C=US' -keyalg RSA -keysize 3072 -validity 10000
          else
            echo 'WILDBUZZARD_CI_DEBUG_KEYSTORE must be configured for stable installable builds' >&2
            exit 1
          fi
      - name: Enable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Install compatible Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --target aarch64-linux-android
      - name: Verify and reuse this fork's native engine
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_RUN: ${{ inputs.engine_run }}
        run: |
          set -Eeuo pipefail
          [[ "$ENGINE_RUN" =~ ^[0-9]+$ ]]
          gh run view "$ENGINE_RUN" --json conclusion,headSha > engine-run.json
          ENGINE_SOURCE="$(python3 -c "import json; d=json.load(open('engine-run.json')); assert d['conclusion']=='success'; print(d['headSha'])")"
          git fetch --no-tags --depth=1 origin "$ENGINE_SOURCE"
          gh run download "$ENGINE_RUN" --name "wildbuzzard-android-arm64-$ENGINE_SOURCE" --dir engine-input
          python3 wildbuzzard/android/scripts/prepare-engine-artifact.py engine-input "${GITHUB_WORKSPACE}-engine"
      - name: Bootstrap Mozilla Android toolchain
        timeout-minutes: 30
        run: |
          set -Eeuo pipefail
          ./mach --no-interactive bootstrap --application-choice mobile_android_artifact_mode 2>&1 | tee artifacts/bootstrap.log
      - name: Assemble Gecko Java bindings and resources with verified AArch64 binaries
        run: |
          set -Eeuo pipefail
          ./mach build 2>&1 | tee artifacts/gecko-build.log
      - name: Assemble Fenix product and external agent probe
        run: |
          set -Eeuo pipefail
          ./mach gradle :fenix:assembleDebug :wildbuzzard-agent-probe:assembleDebug :wildbuzzard-agent-probe:assembleDebugAndroidTest 2>&1 | tee artifacts/apk-build.log
          python3 wildbuzzard/android/scripts/collect-artifacts.py artifacts
      - name: Save Android toolchains and Gradle downloads
        if: always() && !cancelled() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.MOZBUILD_STATE_PATH }}
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-toolchain-v2-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'mobile/android/android-components/.config.yml', 'mobile/android/*/build.gradle', 'mobile/android/fenix/app/build.gradle', 'python/mozboot/mozboot/android.py', 'python/mozboot/mozboot/mozconfig.py') }}
      - name: Preserve build logs and APK artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wildbuzzard-android-ui-arm64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
