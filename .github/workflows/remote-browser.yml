name: Coordinate an application builder
'on':
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      warm_gkrust:
        default: false
        type: boolean
      force_rebuild:
        default: false
        type: boolean
    secrets:
      BUILD_REPOS_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        filter: blob:none
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /agent/packaging/*.py
          /browser/taskarian/config/version.txt
    - name: Coordinate and collect this architecture
      env:
        GH_TOKEN: ${{ secrets.BUILD_REPOS_TOKEN }}
        BROWSER_TARGET: ${{ inputs.target }}
        WARM_GKRUST: ${{ inputs.warm_gkrust }}
        FORCE_REBUILD: ${{ inputs.force_rebuild }}
      run: python3 agent/packaging/remote-browser.py "$BROWSER_TARGET" --directory "$RUNNER_TEMP/component" --warm-gkrust "$WARM_GKRUST" --force-rebuild "$FORCE_REBUILD"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: taskarian-${{ inputs.target }}-candidate
        path: ${{ runner.temp }}/component/
        if-no-files-found: error
        compression-level: 0
