# SPDX-License-Identifier: AGPL-3.0-or-later
name: Android ARM64 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MOZCONFIG: ${{ github.workspace }}/wildbuzzard/android/mozconfig
      MOZBUILD_STATE_PATH: ${{ github.workspace }}/../wildbuzzard-mozbuild
      MOZ_AUTOMATION: '0'
      GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx3g'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare hosted runner
        run: |
          set -Eeuo pipefail
          mkdir -p artifacts
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev python3-venv libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdbus-glib-1-dev libdrm-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev m4 nasm unzip zip zstd
          sudo fallocate -l 8G /mnt/wildbuzzard.swap
          sudo chmod 600 /mnt/wildbuzzard.swap
          sudo mkswap /mnt/wildbuzzard.swap
          sudo swapon /mnt/wildbuzzard.swap
          df -h
      - name: Bootstrap Mozilla Android toolchain
        run: |
          set -Eeuo pipefail
          ./mach --no-interactive bootstrap --application-choice mobile_android 2>&1 | tee artifacts/bootstrap.log
      - name: Compile Gecko for AArch64
        run: |
          set -Eeuo pipefail
          ./mach build 2>&1 | tee artifacts/gecko-build.log
      - name: Assemble Fenix product and external agent probe
        run: |
          set -Eeuo pipefail
          ./mach gradle :fenix:assembleDebug :wildbuzzard-agent-probe:assembleDebug 2>&1 | tee artifacts/apk-build.log
          python3 wildbuzzard/android/scripts/collect-artifacts.py artifacts
      - name: Preserve build logs and APK artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wildbuzzard-android-arm64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
